name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-proypers25-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloud Build to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run Spot regression and pipeline tests
        working-directory: backend
        run: |
          set -euo pipefail
          node tests/spotManagedQuantityRepair.test.js
          node tests/spotDustResidual.test.js
          node tests/spotCostGovernance.test.js
          node tests/spotProfitTargetGovernance.test.js
          node tests/tacticalMomentumExitPolicy.test.js
          node tests/spotPositionLifecycle.test.js
          node tests/controlledSpotExitExecutor.test.js
          node tests/controlledSpotSubmittedQuantity.test.js
          node tests/spotCycleObservability.test.js
          node tests/spotLiveEvidence.test.js
          node tests/spotRealPipeline.test.js
          node tests/professionalInvestmentsDashboard.test.js
          node tests/spotDiscoveryIntelligence.test.js
          node tests/spotDiscoveryLongHorizon.test.js
          node tests/spotShadowDecisionEngine.test.js
          node tests/spotShadowGemHunter.test.js
          node tests/unifiedControlPortal.test.js
          node --check services/spotDustResidual.js
          node --check services/spotManagedQuantityRepair.js
          node --check services/spotCostGovernance.js
          node --check services/spotProfitTargetGovernance.js
          node --check services/controlledSpotExitExecutor.js
          node --check services/approvedSpotRealExecutor.js
          node --check services/spotPositionLifecycle.js
          node --check services/paperToRealEntryGate.js
          node --check services/spotRealPipelinePolicy.js
          node --check services/spotCycleObservability.js
          node --check services/spotLiveEvidence.js
          node --check routes/spotCostGovernance.route.js
          node --check routes/controlledRealSpot.route.js
          node --check server.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: proypers2025

      - name: Submit immutable build and deployment
        shell: bash
        run: |
          set -euo pipefail
          gcloud builds submit --project=proypers2025 --config=cloudbuild.yaml --substitutions=_IMAGE_TAG="$GITHUB_SHA" .

      - name: Diagnose failed Cloud Build or Cloud Run revision
        if: failure()
        shell: bash
        run: |
          set -u
          BUILD_ID=$(gcloud builds list --project=proypers2025 --limit=1 --sort-by='~createTime' --format='value(id)' || true)
          echo "Latest Cloud Build: ${BUILD_ID:-unavailable}"
          if [ -n "${BUILD_ID:-}" ]; then
            gcloud builds describe "$BUILD_ID" --project=proypers2025 --format='yaml(id,status,results,steps)' || true
            gcloud builds log "$BUILD_ID" --project=proypers2025 || true
            gcloud logging read "resource.type=build AND labels.build_id=$BUILD_ID" --project=proypers2025 --limit=250 --order=asc --format='value(timestamp,severity,textPayload,jsonPayload.message,jsonPayload.error)' || true
          fi
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="proypers25-backend" AND severity>=ERROR' --project=proypers2025 --freshness=45m --limit=100 --order=desc --format='value(timestamp,severity,resource.labels.revision_name,textPayload,jsonPayload.message,jsonPayload.error)' || true

      - name: Verify immutable Cloud Run revision
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="proypers2025"
          RUN_REGION="southamerica-west1"
          SERVICE="proypers25-backend"

          URL=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$RUN_REGION" --platform=managed --format='value(status.url)')
          CREATED_REVISION=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$RUN_REGION" --platform=managed --format='value(status.latestCreatedRevisionName)')
          READY_REVISION=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$RUN_REGION" --platform=managed --format='value(status.latestReadyRevisionName)')
          test -n "$URL"
          test -n "$CREATED_REVISION"
          test "$READY_REVISION" = "$CREATED_REVISION"
          echo "Cloud Run URL: $URL"
          echo "Ready revision: $READY_REVISION"

          VERSION=$(curl --silent --show-error --fail-with-body --retry 8 --retry-all-errors --retry-delay 10 --max-time 30 "$URL/__version")
          echo "$VERSION" | jq .
          DEPLOYED_SHA=$(jq -r '.commit // empty' <<<"$VERSION")
          if [ "$DEPLOYED_SHA" != "$GITHUB_SHA" ]; then
            echo "Expected SHA: $GITHUB_SHA"
            echo "Deployed SHA: ${DEPLOYED_SHA:-missing}"
            exit 1
          fi
          echo "APP_COMMIT_SHA verified: $DEPLOYED_SHA"

      - name: Enable Scheduler and verify one fresh Spot cycle
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          PROJECT="proypers2025"
          RUN_REGION="southamerica-west1"
          SCHEDULER_REGION="southamerica-east1"
          SERVICE="proypers25-backend"
          JOB="spot-real-execution"
          URL=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$RUN_REGION" --platform=managed --format='value(status.url)')

          COST=$(curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors --retry-delay 5 --max-time 120 \
            -X POST "$URL/internal/cron/binance/spot-cost-governance" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            --data '{}')
          jq -e '.ok == true and (.economics.cost_source | type == "string") and (.economics.infrastructure_cost_30d_usd | type == "number") and (.economics.net_after_infrastructure_30d_usd | type == "number")' <<<"$COST" >/dev/null
          jq -e '.profit_target.monthly_cost_floor_clp >= 45000 and .profit_target.jobs_reduced_for_cost == false and .profit_target.research_frequency_multiplier == 1 and .profit_target.target_trading_pnl_clp > .profit_target.effective_infrastructure_cost_clp' <<<"$COST" >/dev/null
          echo "Profit target recalculated: $(jq -r '.profit_target.status' <<<"$COST") · policy=$(jq -r '.profit_target.job_frequency_policy' <<<"$COST")"

          STATE=$(gcloud scheduler jobs describe "$JOB" --project="$PROJECT" --location="$SCHEDULER_REGION" --format='value(state)' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          if [ "$STATE" = "PAUSED" ]; then
            gcloud scheduler jobs resume "$JOB" --project="$PROJECT" --location="$SCHEDULER_REGION"
          fi

          REQUESTED_AT_EPOCH=$(date -u +%s)
          gcloud scheduler jobs run "$JOB" --project="$PROJECT" --location="$SCHEDULER_REGION"
          echo "Immediate Spot cycle requested: $JOB"

          LIVE=''
          FRESH_CYCLE=0
          FRESH_ANALYSIS=0
          for attempt in $(seq 1 36); do
            sleep 10
            LIVE=$(curl --silent --show-error --fail-with-body --max-time 45 -H "x-cron-secret: $CRON_SECRET" "$URL/internal/spot-live/evidence" || true)
            if [ -z "$LIVE" ]; then
              echo "Attempt $attempt: live evidence unavailable"
              continue
            fi

            CYCLE_TIME=$(jq -r '.latest_cycle.timestamp // .latest_cycle.started_at // empty' <<<"$LIVE" 2>/dev/null || true)
            ANALYSIS_TIME=$(jq -r '.engine.last_analysis_at // empty' <<<"$LIVE" 2>/dev/null || true)
            CYCLE_EPOCH=$(node -e 'const v=process.argv[1]; const t=Date.parse(v||""); process.stdout.write(Number.isFinite(t)?String(Math.floor(t/1000)):"0")' "$CYCLE_TIME")
            ANALYSIS_EPOCH=$(node -e 'const v=process.argv[1]; const t=Date.parse(v||""); process.stdout.write(Number.isFinite(t)?String(Math.floor(t/1000)):"0")' "$ANALYSIS_TIME")

            if [ "$CYCLE_EPOCH" -ge "$REQUESTED_AT_EPOCH" ]; then FRESH_CYCLE=1; fi
            if [ "$ANALYSIS_EPOCH" -ge "$REQUESTED_AT_EPOCH" ]; then FRESH_ANALYSIS=1; fi
            echo "Attempt $attempt: cycle=$CYCLE_TIME analysis=$ANALYSIS_TIME"
            if [ "$FRESH_CYCLE" = "1" ] && [ "$FRESH_ANALYSIS" = "1" ]; then break; fi
          done

          test "$FRESH_CYCLE" = "1"
          test "$FRESH_ANALYSIS" = "1"
          jq -e '.ok == true and .real_mode == true and .spot_only == true' <<<"$LIVE" >/dev/null
          jq -e '.latest_cycle != null and .latest_cycle.decision != "FAILED"' <<<"$LIVE" >/dev/null
          jq -e '.latest_cycle.gates.promotion_blocks_entry == false' <<<"$LIVE" >/dev/null
          jq -e '.latest_cycle.gates.paper_to_real == "PASS" or .latest_cycle.gates.paper_to_real == "BLOCK"' <<<"$LIVE" >/dev/null

          FINAL_STATE=$(gcloud scheduler jobs describe "$JOB" --project="$PROJECT" --location="$SCHEDULER_REGION" --format='value(state)' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$FINAL_STATE" = "ENABLED"
          echo "Fresh current Spot cycle verified. Scheduler state: $FINAL_STATE"

      - name: Diagnose failed post-deployment verification
        if: failure()
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          PROJECT="proypers2025"
          RUN_REGION="southamerica-west1"
          SCHEDULER_REGION="southamerica-east1"
          SERVICE="proypers25-backend"
          JOB="spot-real-execution"

          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$RUN_REGION" --platform=managed --format='yaml(status.url,status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic)' || true
          gcloud scheduler jobs describe "$JOB" --project="$PROJECT" --location="$SCHEDULER_REGION" --format='yaml(name,state,schedule,status,lastAttemptTime,httpTarget.uri)' || true
          URL=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$RUN_REGION" --platform=managed --format='value(status.url)' 2>/dev/null || true)
          if [ -n "$URL" ]; then
            echo "Runtime version:"
            curl --silent --show-error --max-time 30 "$URL/__version" || true
            echo
            if [ -n "${CRON_SECRET:-}" ]; then
              echo "Current cost governance:"
              curl --silent --show-error --max-time 60 -H "x-cron-secret: $CRON_SECRET" "$URL/internal/spot-cost-governance/status" || true
              echo
              echo "Current live evidence:"
              curl --silent --show-error --max-time 60 -H "x-cron-secret: $CRON_SECRET" "$URL/internal/spot-live/evidence" || true
              echo
            fi
          fi
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="proypers25-backend" AND severity>=ERROR' --project="$PROJECT" --freshness=45m --limit=100 --order=desc --format='value(timestamp,severity,resource.labels.revision_name,textPayload,jsonPayload.message,jsonPayload.error)' || true

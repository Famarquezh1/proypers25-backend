name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-proypers25-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloud Build to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run Spot regression and pipeline tests
        working-directory: backend
        run: |
          set -euo pipefail
          node tests/spotManagedQuantityRepair.test.js
          node tests/spotDustResidual.test.js
          node tests/spotCostGovernance.test.js
          node tests/spotProfitTargetGovernance.test.js
          node tests/tacticalMomentumExitPolicy.test.js
          node tests/immediateTacticalEntryGate.test.js
          node tests/earlyMomentumRadar.test.js
          node tests/legacySpotRecoveryLiquidator.test.js
          node tests/xecHistoricalHoldingPolicy.test.js
          node tests/protectedReserveAsset.test.js
          node tests/spotPositionLifecycle.test.js
          node tests/controlledSpotExitExecutor.test.js
          node tests/controlledSpotSubmittedQuantity.test.js
          node tests/spotCycleObservability.test.js
          node tests/spotLiveEvidence.test.js
          node tests/spotRealPipeline.test.js
          node tests/professionalInvestmentsDashboard.test.js
          node tests/spotDiscoveryIntelligence.test.js
          node tests/spotDiscoveryLongHorizon.test.js
          node tests/spotShadowDecisionEngine.test.js
          node tests/spotShadowGemHunter.test.js
          node tests/unifiedControlPortal.test.js
          node --check services/spotDustResidual.js
          node --check services/spotManagedQuantityRepair.js
          node --check services/spotCostGovernance.js
          node --check services/spotProfitTargetGovernance.js
          node --check services/controlledSpotExitExecutor.js
          node --check services/legacySpotRecoveryLiquidator.js
          node --check services/xecHistoricalHoldingPolicy.js
          node --check services/xecHistoricalHoldingManager.js
          node --check services/approvedSpotRealExecutor.js
          node --check services/spotPositionLifecycle.js
          node --check services/spotEarlyMomentumRadar.js
          node --check services/paperToRealEntryGate.js
          node --check services/spotRealPipelinePolicy.js
          node --check services/spotCycleObservability.js
          node --check services/spotLiveEvidence.js
          node --check routes/spotCostGovernance.route.js
          node --check routes/controlledRealSpot.route.js
          node --check server.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: proypers2025

      - name: Submit immutable build and deployment
        shell: bash
        run: |
          set -euo pipefail
          gcloud builds submit \
            --project=proypers2025 \
            --config=cloudbuild.yaml \
            --substitutions=_IMAGE_TAG="$GITHUB_SHA" .

      - name: Verify immutable Cloud Run revision
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="proypers2025"
          REGION="southamerica-west1"
          SERVICE="proypers25-backend"

          URL=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --platform=managed --format='value(status.url)')
          CREATED=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --platform=managed --format='value(status.latestCreatedRevisionName)')
          READY=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --platform=managed --format='value(status.latestReadyRevisionName)')
          test -n "$URL"
          test "$READY" = "$CREATED"

          VERSION=$(curl --silent --show-error --fail-with-body --retry 8 --retry-all-errors --retry-delay 10 --max-time 30 "$URL/__version")
          DEPLOYED_SHA=$(jq -r '.commit // empty' <<<"$VERSION")
          test "$DEPLOYED_SHA" = "$GITHUB_SHA"
          echo "Cloud Run revision verified: $READY · SHA=$DEPLOYED_SHA"

      - name: Verify one fresh Spot cycle
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"

          PROJECT="proypers2025"
          RUN_REGION="southamerica-west1"
          SCHEDULER_REGION="southamerica-east1"
          SERVICE="proypers25-backend"
          JOB="spot-real-execution"
          URL=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$RUN_REGION" --platform=managed --format='value(status.url)')

          COST=$(curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors --retry-delay 5 --max-time 120 \
            -X POST "$URL/internal/cron/binance/spot-cost-governance" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            --data '{}')
          jq -e '.ok == true and .profit_target.jobs_reduced_for_cost == false and .profit_target.research_frequency_multiplier == 1' <<<"$COST" >/dev/null

          STATE=$(gcloud scheduler jobs describe "$JOB" \
            --project="$PROJECT" \
            --location="$SCHEDULER_REGION" \
            --format='value(state)' 2>/dev/null \
            | tr -d '[:space:]' \
            | tr '[:lower:]' '[:upper:]' || true)

          REQUESTED_AT_EPOCH=$(date -u +%s)
          if [ "$STATE" = "ENABLED" ]; then
            gcloud scheduler jobs run "$JOB" --project="$PROJECT" --location="$SCHEDULER_REGION"
            EXECUTION_MODE="CLOUD_SCHEDULER"
          else
            DIRECT=$(curl --silent --show-error --fail-with-body \
              --retry 3 --retry-all-errors --retry-delay 5 --max-time 240 \
              -X POST "$URL/internal/cron/binance/spot-real-execution" \
              -H "Content-Type: application/json" \
              -H "x-cron-secret: $CRON_SECRET" \
              --data '{}')
            jq -e '.real_mode == true and .spot_only == true and .ok != false' <<<"$DIRECT" >/dev/null
            EXECUTION_MODE="DIRECT_FALLBACK"
          fi
          echo "Spot cycle requested through $EXECUTION_MODE · scheduler=${STATE:-UNKNOWN}"

          LIVE=''
          FRESH_CYCLE=0
          FRESH_ANALYSIS=0
          for attempt in $(seq 1 36); do
            sleep 10
            LIVE=$(curl --silent --show-error --fail-with-body --max-time 45 \
              -H "x-cron-secret: $CRON_SECRET" \
              "$URL/internal/spot-live/evidence" || true)
            [ -n "$LIVE" ] || continue

            CYCLE_TIME=$(jq -r '.latest_cycle.timestamp // .latest_cycle.started_at // empty' <<<"$LIVE" 2>/dev/null || true)
            ANALYSIS_TIME=$(jq -r '.engine.last_analysis_at // empty' <<<"$LIVE" 2>/dev/null || true)
            CYCLE_EPOCH=$(node -e 'const t=Date.parse(process.argv[1]||"");process.stdout.write(Number.isFinite(t)?String(Math.floor(t/1000)):"0")' "$CYCLE_TIME")
            ANALYSIS_EPOCH=$(node -e 'const t=Date.parse(process.argv[1]||"");process.stdout.write(Number.isFinite(t)?String(Math.floor(t/1000)):"0")' "$ANALYSIS_TIME")
            [ "$CYCLE_EPOCH" -ge "$REQUESTED_AT_EPOCH" ] && FRESH_CYCLE=1 || true
            [ "$ANALYSIS_EPOCH" -ge "$REQUESTED_AT_EPOCH" ] && FRESH_ANALYSIS=1 || true
            [ "$FRESH_CYCLE" = "1" ] && [ "$FRESH_ANALYSIS" = "1" ] && break
          done

          test "$FRESH_CYCLE" = "1"
          test "$FRESH_ANALYSIS" = "1"
          jq -e '.ok == true and .real_mode == true and .spot_only == true' <<<"$LIVE" >/dev/null
          jq -e '.latest_cycle != null and .latest_cycle.decision != "FAILED"' <<<"$LIVE" >/dev/null
          jq -e '.latest_cycle.gates.promotion_blocks_entry == false' <<<"$LIVE" >/dev/null
          jq -e '.latest_cycle.gates.paper_to_real == "PASS" or .latest_cycle.gates.paper_to_real == "BLOCK"' <<<"$LIVE" >/dev/null

          LEGACY=$(curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors --retry-delay 5 --max-time 120 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$URL/internal/spot-legacy-recovery/status")
          jq -e '.ok == true and .config.enabled == true and .config.xec_never_sell == true' <<<"$LEGACY" >/dev/null
          jq -e '(.config.target_assets | sort) == (["ANKR","BAR","CATI","LAYER","QTUM"] | sort)' <<<"$LEGACY" >/dev/null
          jq -e '(.config.protected_assets | index("XEC")) != null and (.config.target_assets | index("XEC")) == null' <<<"$LEGACY" >/dev/null

          XEC=$(curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors --retry-delay 5 --max-time 120 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$URL/internal/spot-xec-holding/status")
          jq -e '.ok == true and .autonomous == true and .new_entries_allowed == false' <<<"$XEC" >/dev/null
          jq -e '.config.enabled == true and .config.xec_managed_exit_enabled == true and .config.new_xec_entries_allowed == false' <<<"$XEC" >/dev/null
          jq -e '.state != null' <<<"$XEC" >/dev/null

          echo "Fresh Spot cycle verified · mode=$EXECUTION_MODE · scheduler=${STATE:-UNKNOWN} · XEC autonomous exit manager active"

      - name: Diagnose failure
        if: failure()
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          PROJECT="proypers2025"
          REGION="southamerica-west1"
          SERVICE="proypers25-backend"
          URL=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --platform=managed --format='value(status.url)' 2>/dev/null || true)
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --platform=managed --format='yaml(status.url,status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic)' || true
          gcloud scheduler jobs describe spot-real-execution --project="$PROJECT" --location=southamerica-east1 --format='yaml(name,state,schedule,status,lastAttemptTime,httpTarget.uri)' || true
          if [ -n "$URL" ] && [ -n "${CRON_SECRET:-}" ]; then
            curl --silent --show-error --max-time 60 -H "x-cron-secret: $CRON_SECRET" "$URL/internal/spot-live/evidence" || true
            echo
            curl --silent --show-error --max-time 60 -H "x-cron-secret: $CRON_SECRET" "$URL/internal/spot-legacy-recovery/status" || true
            echo
            curl --silent --show-error --max-time 60 -H "x-cron-secret: $CRON_SECRET" "$URL/internal/spot-xec-holding/status" || true
          fi

name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'cloudbuild.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-proypers25-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloud Build to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run Spot regression and pipeline tests
        working-directory: backend
        run: |
          set -euo pipefail
          node tests/spotManagedQuantityRepair.test.js
          node tests/spotDustResidual.test.js
          node tests/spotDustSweeper.test.js
          node tests/spotCostGovernance.test.js
          node tests/spotProfitTargetGovernance.test.js
          node tests/tacticalMomentumExitPolicy.test.js
          node tests/immediateTacticalEntryGate.test.js
          node tests/earlyMomentumRadar.test.js
          node tests/spotGemRadarProductiveSelection.test.js
          node tests/spotLocalQuboOptimizer.test.js
          node tests/legacySpotRecoveryLiquidator.test.js
          node tests/xecHistoricalHoldingPolicy.test.js
          node tests/protectedReserveAsset.test.js
          node tests/spotPositionLifecycle.test.js
          node tests/controlledSpotExitExecutor.test.js
          node tests/spotExitKillSwitchSafety.test.js
          node tests/controlledSpotSubmittedQuantity.test.js
          node tests/spotCycleObservability.test.js
          node tests/spotLiveEvidence.test.js
          node tests/spotRealPipeline.test.js
          node tests/spotQuantEntryDecision.test.js
          node tests/spotAutonomyCooldown.test.js
          node tests/managedSpotAcquisitionPolicy.test.js
          node tests/spotRecoveryProductivityCapacity.test.js
          node tests/adaptiveSpotStrategyController.test.js
          node tests/professionalInvestmentsDashboard.test.js
          node tests/spotDiscoveryIntelligence.test.js
          node tests/spotDiscoveryLongHorizon.test.js
          node tests/spotShadowDecisionEngine.test.js
          node tests/spotShadowGemHunter.test.js
          node tests/unifiedControlPortal.test.js
          node --check services/spotDustResidual.js
          node --check services/spotEntryMarketSafety.js
          node --check services/spotDustSweeper.js
          node --check services/spotManagedQuantityRepair.js
          node --check services/spotManagedAcquisitionPolicy.js
          node --check services/spotCostGovernance.js
          node --check services/spotProfitTargetGovernance.js
          node --check services/controlledSpotExitExecutor.js
          node --check services/legacySpotRecoveryLiquidator.js
          node --check services/xecHistoricalHoldingPolicy.js
          node --check services/xecHistoricalHoldingManager.js
          node --check services/approvedSpotRealExecutor.js
          node --check services/spotPositionLifecycle.js
          node --check services/spotEarlyMomentumRadar.js
          node --check services/spotGemRadar.js
          node --check services/spotLocalQuboOptimizer.js
          node --check services/paperToRealEntryGate.js
          node --check services/spotRealLearningPolicy.js
          node --check services/spotRealPipelinePolicy.js
          node --check services/spotQuantEntryDecision.js
          node --check services/spotAutonomyController.js
          node --check services/adaptiveSpotStrategyController.js
          node --check services/spotCycleObservability.js
          node --check services/spotLiveEvidence.js
          node --check routes/investmentsSummary.route.js
          node --check routes/spotLiveDashboard.route.js
          node --check routes/professionalInvestmentsDashboard.route.js
          node --check routes/spotCostGovernance.route.js
          node --check routes/controlledRealSpot.route.js
          node --check routes/newSpotAssetDiscovery.route.js
          node --check server.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: proypers2025

      - name: Validate deployment secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          echo "::add-mask::$CRON_SECRET"

      - name: Submit immutable build and deployment
        shell: bash
        run: |
          set -euo pipefail
          gcloud builds submit \
            --project=proypers2025 \
            --config=cloudbuild.yaml \
            --substitutions=_IMAGE_TAG="$GITHUB_SHA" .

      - name: Verify immutable Cloud Run revision
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="proypers2025"
          REGION="southamerica-west1"
          SERVICE="proypers25-backend"
          URL=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --platform=managed --format='value(status.url)')
          CREATED=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --platform=managed --format='value(status.latestCreatedRevisionName)')
          READY=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --platform=managed --format='value(status.latestReadyRevisionName)')
          test -n "$URL"
          test "$READY" = "$CREATED"
          VERSION=$(curl --silent --show-error --fail-with-body --retry 8 --retry-all-errors --retry-delay 10 --max-time 30 "$URL/__version")
          DEPLOYED_SHA=$(jq -r '.commit // empty' <<<"$VERSION")
          test "$DEPLOYED_SHA" = "$GITHUB_SHA"
          echo "Cloud Run revision verified: $READY · SHA=$DEPLOYED_SHA"

      - name: Verify Spot service without forcing a trade cycle
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="proypers2025"
          REGION="southamerica-west1"
          SERVICE="proypers25-backend"
          URL=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --platform=managed --format='value(status.url)')

          LIVE=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 60 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$URL/internal/spot-live/evidence")
          jq -e '.ok == true and .real_mode == true and .spot_only == true' <<<"$LIVE" >/dev/null
          jq -e '(.open_positions | type) == "array"' <<<"$LIVE" >/dev/null

          SUMMARY=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 60 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$URL/internal/investments/summary")
          jq -e '
            .ok == true and
            (.allocation.max_per_acquisition_usdt | type == "number") and
            (.allocation.max_per_acquisition_usdt > 0) and
            (.allocation.max_per_acquisition_usdt <= 100) and
            (.allocation.max_managed_spot_assets | type == "number") and
            (.allocation.max_managed_spot_assets >= 1) and
            (.allocation.max_managed_spot_assets <= 4) and
            (.allocation.max_total_managed_capital_usdt | type == "number") and
            (.allocation.max_total_managed_capital_usdt > 0) and
            (.allocation.max_total_managed_capital_usdt <= 500)
          ' <<<"$SUMMARY" >/dev/null

          echo "Spot service verified without triggering an additional real trading cycle."

      - name: Diagnose failure
        if: failure()
        shell: bash
        run: |
          set -u
          PROJECT="proypers2025"
          REGION="southamerica-west1"
          SERVICE="proypers25-backend"
          URL=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --platform=managed --format='value(status.url)' 2>/dev/null || true)
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --platform=managed --format='yaml(status.url,status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic)' || true
          if [ -n "$URL" ] && [ -n "${CRON_SECRET:-}" ]; then
            curl --silent --show-error --max-time 30 -H "x-cron-secret: $CRON_SECRET" "$URL/internal/spot-live/evidence" || true
          fi

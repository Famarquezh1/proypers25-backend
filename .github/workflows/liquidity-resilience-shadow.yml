name: Liquidity Resilience Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: [self-hosted, Windows, X64, research-only]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated websocket dependency
        shell: powershell
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'liquidity-resilience-deps'
          if (Test-Path $deps) { Remove-Item -Recurse -Force $deps }
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          npm install --no-save --ignore-scripts --prefix $deps ws
          "NODE_PATH=$deps\node_modules" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Syntax check
        run: node --check backend/scripts/github-liquidity-resilience-shadow.js
      - name: Collect public depth/trades
        env:
          LR_RUN_MS: '240000'
        run: node backend/scripts/github-liquidity-resilience-shadow.js
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-resilience-shadow-${{ github.run_id }}
          path: liquidity-resilience-shadow.ndjson
          retention-days: 30

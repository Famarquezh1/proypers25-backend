name: Spot TimesFM Research Preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/timesfm/preflight.py'
      - '.github/workflows/spot-timesfm-research-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    name: TimesFM read-only resource check
    runs-on: [self-hosted, Windows, X64, research-only, research-light]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Locate compatible Python
        id: py
        shell: powershell
        run: |
          $candidates = @(
            @{exe='py'; prefix=@('-3.13')},
            @{exe='py'; prefix=@('-3.12')},
            @{exe='py'; prefix=@('-3.11')},
            @{exe='py'; prefix=@('-3.10')},
            @{exe='python'; prefix=@()},
            @{exe='C:\Users\Famarquezh1\AppData\Local\Programs\Python\Python313\python.exe'; prefix=@()},
            @{exe='C:\Users\Famarquezh1\AppData\Local\Programs\Python\Python39\python.exe'; prefix=@()}
          )
          foreach ($candidate in $candidates) {
            try {
              $exe=$candidate.exe
              if ($exe -match '\\' -and -not (Test-Path $exe)) { continue }
              $prefix=@($candidate.prefix)
              & $exe @prefix -c "import sys; print(sys.executable); assert sys.version_info >= (3,10)"
              if ($LASTEXITCODE -eq 0) {
                "exe=$exe" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
                "prefix=$($prefix -join ' ')" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
                exit 0
              }
            } catch {}
          }
          throw 'Python >=3.10 not found or inaccessible to runner service'
      - name: Install tiny preflight dependency
        shell: powershell
        run: |
          $exe="${{ steps.py.outputs.exe }}"
          $prefix="${{ steps.py.outputs.prefix }}"
          $argv=@()
          if ($prefix) { $argv += $prefix.Split(' ') }
          & $exe @argv -m pip install --quiet psutil
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run preflight
        shell: powershell
        run: |
          $exe="${{ steps.py.outputs.exe }}"
          $prefix="${{ steps.py.outputs.prefix }}"
          $argv=@()
          if ($prefix) { $argv += $prefix.Split(' ') }
          & $exe @argv research/timesfm/preflight.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timesfm-preflight-${{ github.run_id }}
          path: timesfm-preflight.json
          retention-days: 7

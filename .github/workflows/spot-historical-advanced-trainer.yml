name: Spot Historical Advanced Trainer V2

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/scripts/github-spot-historical-advanced-trainer.js'
      - '.github/workflows/spot-historical-advanced-trainer.yml'

permissions:
  contents: read

concurrency:
  group: spot-historical-advanced-trainer-v2
  cancel-in-progress: true

jobs:
  train:
    name: Advanced walk-forward ${{ matrix.days }}d
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        days: [30, 60, 90, 120]
    env:
      TRAIN_LOOKBACK_DAYS: ${{ matrix.days }}
      TRAIN_MAX_SYMBOLS: '32'
      TRAIN_RANDOM_TRIALS: '1600'
      TRAIN_BOOTSTRAPS: '250'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run advanced no-leakage trainer
        working-directory: backend
        run: node scripts/github-spot-historical-advanced-trainer.js

      - name: Upload advanced evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spot-advanced-training-${{ matrix.days }}d-${{ github.run_id }}
          path: |
            backend/training-output/spot-advanced-training-report.json
            backend/training-output/spot-advanced-champion.json
          if-no-files-found: warn
          retention-days: 14

      - name: Window summary
        if: success()
        working-directory: backend
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const r=require('./training-output/spot-advanced-training-report.json');
          const c=r.champion;
          console.log(`### Advanced trainer ${r.lookback_days}d`);
          console.log(`- Muestras: ${r.samples}`);
          console.log(`- Purge temporal: ${r.split.purge_hours}h`);
          console.log(`- Campeón: ${c?.agent || 'ninguno robusto'}`);
          if(c){
            console.log(`- Test neto: ${(c.test.avg_net*100).toFixed(3)}%`);
            console.log(`- Win rate test: ${(c.test.win_rate*100).toFixed(1)}%`);
            console.log(`- Profit factor test: ${c.test.profit_factor.toFixed(2)}`);
            console.log(`- Drawdown test: ${(c.test.max_drawdown*100).toFixed(2)}%`);
            console.log(`- Stress neto: ${(c.stress.avg_net*100).toFixed(3)}%`);
            console.log(`- Bootstrap P05: ${(c.bootstrap_p05*100).toFixed(3)}%`);
          }
          NODE

  consolidate:
    name: Advanced champion stability
    needs: train
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download advanced evidence
        uses: actions/download-artifact@v4
        with:
          pattern: spot-advanced-training-*-${{ github.run_id }}
          path: advanced-combined
          merge-multiple: false

      - name: Consolidate robust champions
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'); const path=require('path');
          const reports=[];
          function walk(d){if(!fs.existsSync(d))return; for(const n of fs.readdirSync(d)){const p=path.join(d,n); const s=fs.statSync(p); if(s.isDirectory())walk(p); else if(n==='spot-advanced-training-report.json')reports.push(JSON.parse(fs.readFileSync(p,'utf8')));}}
          walk('advanced-combined'); reports.sort((a,b)=>a.lookback_days-b.lookback_days);
          const rows=reports.map(r=>({days:r.lookback_days,champion:r.champion?.agent||null,test:r.champion?.test||null,stress:r.champion?.stress||null,p05:r.champion?.bootstrap_p05??null,meta:r.meta_agent}));
          const counts={}; for(const r of rows) if(r.champion) counts[r.champion]=(counts[r.champion]||0)+1;
          const stable=Object.entries(counts).sort((a,b)=>b[1]-a[1]).filter(([,n])=>n>=3).map(([agent,windows])=>({agent,windows}));
          const metaRobust=rows.filter(r=>r.meta?.test?.avg_net>0&&r.meta?.stress?.avg_net>0&&r.meta?.bootstrap_p05>0).length;
          const summary={generated_at:new Date().toISOString(),windows:rows,stable_champions:stable,meta_robust_windows:metaRobust,production_gate:{pass:stable.length>0||metaRobust>=3,reason:stable.length>0?'stable champion in >=3 windows':metaRobust>=3?'meta-agent robust in >=3 windows':'insufficient cross-window robustness'}};
          fs.writeFileSync('spot-advanced-cross-window-summary.json',JSON.stringify(summary,null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n### Advanced cross-window result\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`- Ventanas: ${rows.map(x=>x.days+'d').join(', ')}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`- Campeón estable: ${stable.map(x=>x.agent).join(', ')||'ninguno'}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`- Meta-agente robusto: ${metaRobust}/${rows.length}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`- Gate producción: ${summary.production_gate.pass?'PASS':'HOLD'}\n`);
          NODE

      - name: Upload consolidated advanced evidence
        uses: actions/upload-artifact@v4
        with:
          name: spot-advanced-cross-window-${{ github.run_id }}
          path: spot-advanced-cross-window-summary.json
          retention-days: 14

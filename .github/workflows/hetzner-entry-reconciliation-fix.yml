name: Hetzner sold-entry reconciliation fix
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hetzner-bootstrap-check
  cancel-in-progress: false
jobs:
  hotfix:
    if: github.actor == 'Famarquezh1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5da033f81004160e99b2b094992e09754a6cc2cd
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate without real orders
        run: |
          node --test deploy/hetzner/runtime/*.test.cjs
          node deploy/hetzner/runtime/executor-check.cjs
          node deploy/hetzner/runtime/lifecycle-check.cjs
      - name: Guarded production maintenance with rollback
        env:
          BOOTSTRAP_SSH_KEY: ${{ secrets.HETZNER_BOOTSTRAP_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          WORKDIR=$(mktemp -d)
          trap 'rm -rf "$WORKDIR"' EXIT
          printf '%s\n' "$BOOTSTRAP_SSH_KEY" > "$WORKDIR/key"
          unset BOOTSTRAP_SSH_KEY
          SSH_OPTIONS=(-i "$WORKDIR/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$WORKDIR/known_hosts" -o ConnectTimeout=10)
          tar -czf "$WORKDIR/patch.tgz" -C deploy/hetzner/runtime execution-safety.cjs entry-reconciliation.cjs entry-reconciliation.test.cjs runtime.test.cjs
          scp "${SSH_OPTIONS[@]}" deploy/hetzner/runtime/entry-reconciliation.cjs deploy@89.167.5.87:/home/deploy/entry-reconciliation.cjs
          scp "${SSH_OPTIONS[@]}" deploy/hetzner/reconcile-sold-entry.cjs deploy@89.167.5.87:/home/deploy/reconcile-sold-entry.cjs
          ssh "${SSH_OPTIONS[@]}" deploy@89.167.5.87 'sudo env PROYPERS_ENTRY_HELPER=/home/deploy/entry-reconciliation.cjs node /home/deploy/reconcile-sold-entry.cjs' | tee "$WORKDIR/proof.log"
          grep -q '^REAL_ENTRY_RECONCILIATION_VERIFIED ' "$WORKDIR/proof.log"
          scp "${SSH_OPTIONS[@]}" "$WORKDIR/patch.tgz" deploy@89.167.5.87:/home/deploy/entry-reconciliation-fix.tgz
          ssh "${SSH_OPTIONS[@]}" deploy@89.167.5.87 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          BASE=/opt/proypers25/runtime
          BACKUP=/opt/proypers25/patch-backups/5da033f81004160e99b2b094992e09754a6cc2cd
          test "$(readlink "$BASE")" = '/opt/proypers25/releases/506e0fd99e6467941a8b232c58af50d102a6fc59/runtime'
          test "$(git -C /opt/proypers25/repo rev-parse HEAD)" = '8d88021dea30eb87f786b5685818d01204d132a3'
          systemctl is-active --quiet proypers25-live.service
          test -f /etc/proypers25/LIVE_AUTHORIZATION.json
          test ! -e /var/lib/proypers25/BUY_PAUSED
          test ! -e "$BACKUP"
          test ! -e "$BASE/entry-reconciliation.cjs"
          test ! -e "$BASE/entry-reconciliation.test.cjs"
          (cd "$BASE" && sha256sum --status -c SHA256SUMS)
          python3 - "$BASE" <<'PY'
          import json,sys,pathlib
          e=json.loads((pathlib.Path(sys.argv[1])/'release-evidence.json').read_text())
          assert e['cohortIdentityPatch']['commit']=='98fd8dd58abda671a63dfe24e3ed0166edf51fb3'
          PY
          install -d -m 0700 "$BACKUP"
          for name in execution-safety.cjs runtime.test.cjs SHA256SUMS release-evidence.json; do cp "$BASE/$name" "$BACKUP/$name"; done
          install -m 0600 -o spot -g spot /dev/null /var/lib/proypers25/BUY_PAUSED
          rollback() {
            systemctl stop proypers25-live.service || true
            for name in execution-safety.cjs runtime.test.cjs SHA256SUMS release-evidence.json; do cp "$BACKUP/$name" "$BASE/$name"; chown root:spot "$BASE/$name"; chmod 0640 "$BASE/$name"; done
            rm -f "$BASE/entry-reconciliation.cjs" "$BASE/entry-reconciliation.test.cjs"
            if test -d "$BACKUP/execution-state"; then cp -a "$BACKUP/execution-state/." /var/lib/proypers25/execution-state/; fi
            systemctl start proypers25-live.service
            echo 'ENTRY_PATCH_ROLLED_BACK_NEW_BUYS_REMAIN_PAUSED'
          }
          trap rollback ERR
          systemctl stop proypers25-live.service
          cp -a /var/lib/proypers25/execution-state "$BACKUP/execution-state"
          CREDENTIALS_DIRECTORY=/etc/proypers25 node - <<'JS'
          require('/opt/proypers25/runtime/audit.cjs').audit().then(a=>{
            if(a.reviewRequired!==0||a.unsupportedOrderCount!==0||a.openOrderCount!==0||a.positions.some(p=>p.status!=='DUST'))throw new Error('MAINTENANCE_ACCOUNT_REVIEW_REQUIRED');
            console.log('ENTRY_MAINTENANCE_ACCOUNT_VERIFIED');
          }).catch(()=>{console.error('ENTRY_MAINTENANCE_REFUSED');process.exitCode=2;});
          JS
          install -d -m 0700 "$BACKUP/incoming"
          tar -xzf /home/deploy/entry-reconciliation-fix.tgz -C "$BACKUP/incoming"
          for name in execution-safety.cjs entry-reconciliation.cjs entry-reconciliation.test.cjs runtime.test.cjs; do install -m 0640 -o root -g spot "$BACKUP/incoming/$name" "$BASE/$name"; node --check "$BASE/$name"; done
          python3 - "$BASE" <<'PY'
          import pathlib,hashlib,json,sys,datetime
          p=pathlib.Path(sys.argv[1])
          files=sorted(p.glob('*.cjs'))+[f for f in sorted(p.glob('*.json')) if f.name!='release-evidence.json']+[p/'owner-activate.sh']
          (p/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+str(f)+'\n' for f in files))
          evidence=json.loads((p/'release-evidence.json').read_text())
          evidence['entryReconciliationPatch']={'commit':'5da033f81004160e99b2b094992e09754a6cc2cd','testsPassed':59,'entryScenarios':12,'restartScenarios':8,'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'strategyChanged':False}
          (p/'release-evidence.json').write_text(json.dumps(evidence))
          PY
          chown root:spot "$BASE/SHA256SUMS" "$BASE/release-evidence.json"
          chmod 0640 "$BASE/SHA256SUMS" "$BASE/release-evidence.json"
          (cd "$BASE" && sha256sum --status -c SHA256SUMS)
          node /home/deploy/reconcile-sold-entry.cjs --apply
          STARTED=$(date +%s)
          systemctl start proypers25-live.service
          HEALTHY=false
          for attempt in $(seq 1 36); do
            if python3 - "$STARTED" <<'PY'
          import json,sys,datetime,subprocess
          since=int(sys.argv[1])
          base='/var/lib/proypers25/'
          h=json.load(open(base+'heartbeat.json'))
          e=json.load(open(base+'github-spot-auto-exit.js.last.json'))
          r=json.load(open(base+'recover-orders.cjs.last.json'))
          s=json.load(open(base+'shadow-status.json'))
          def sec(x): return datetime.datetime.fromisoformat(x.replace('Z','+00:00')).timestamp()
          assert sec(r['at'])>=since and r['code']==0 and not r['timedOut']
          assert sec(e['at'])>=since and e['code']==0 and not e['timedOut']
          assert sec(s['at'])>=since and s['exitCode']==0 and s['radarCode']==0
          assert sec(h['at'])>=since and h['mode']=='LIVE_CORE_ONLY' and h['tradingActivated'] is True and h['newBuysBlocked'] is True
          assert h['pid']==int(subprocess.check_output(['systemctl','show','proypers25-live.service','-p','MainPID','--value']))
          PY
            then HEALTHY=true; break; fi
            sleep 5
          done
          test "$HEALTHY" = true
          rm /var/lib/proypers25/BUY_PAUSED
          trap - ERR
          echo 'ENTRY_RECONCILIATION_PATCH_DEPLOYED recovery=passed exits=passed radar=passed strategy_changed=false'
          systemctl is-active proypers25-live.service
          REMOTE

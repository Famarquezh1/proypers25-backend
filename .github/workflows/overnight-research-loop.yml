name: Autonomous Research Loop

on:
  push:
    branches: [research/post-signal-continuation-autopsy]
  pull_request:
    types: [opened]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: proypers-autonomous-research
  cancel-in-progress: true

jobs:
  trigger-sentinel:
    if: ${{ github.event_name == 'pull_request' || (!contains(github.event.head_commit.message || '', '[research-result]') && !contains(github.event.head_commit.message || '', '[research-sentinel]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/post-signal-continuation-autopsy
          fetch-depth: 0
      - name: Persist trigger evidence
        shell: bash
        run: |
          mkdir -p research
          printf '{"run_id":"%s","run_attempt":"%s","sha":"%s","triggered_at":"%s","status":"TRIGGERED_SELF_HOSTED_PENDING"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > research/TRIGGER_PROBE.json
          git config user.name "proypers-research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add research/TRIGGER_PROBE.json
          git commit -m "research: workflow trigger probe [research-sentinel]"
          git push origin HEAD:research/post-signal-continuation-autopsy

  research-batch:
    needs: trigger-sentinel
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 50
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/post-signal-continuation-autopsy
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Research safety and syntax preflight
        shell: powershell
        run: |
          node --check backend/scripts/github-frontloaded-walkforward-bench.js
          node --check backend/scripts/persist-frontloaded-research.js
          $all = Get-Content backend/scripts/github-frontloaded-walkforward-bench.js,backend/scripts/persist-frontloaded-research.js -Raw
          if ($all -match 'api/v3/order|fapi/v1/order|BINANCE_API_KEY|BINANCE_SECRET|firebase-admin') {
            throw 'Forbidden execution capability detected in research scripts'
          }
          New-Item -ItemType Directory -Force -Path research/results | Out-Null

      - name: Front-loaded purged walk-forward bench
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEARCH_EXECUTION_ENV: self-hosted-windows-x64
        run: |
          node backend/scripts/github-frontloaded-walkforward-bench.js | Out-File -FilePath research/results/frontloaded_walkforward.json -Encoding utf8
          Get-Content research/results/frontloaded_walkforward.json

      - name: Persist scientific checkpoint
        shell: powershell
        env:
          RESEARCH_EXECUTION_ENV: self-hosted-windows-x64
        run: |
          node backend/scripts/persist-frontloaded-research.js research/results/frontloaded_walkforward.json | Out-File -FilePath research/results/checkpoint.json -Encoding utf8
          Get-Content research/results/checkpoint.json

      - name: Mark runner completion
        shell: powershell
        run: |
          $probe = @{
            run_id = "$env:GITHUB_RUN_ID"
            run_attempt = "$env:GITHUB_RUN_ATTEMPT"
            sha = "$env:GITHUB_SHA"
            completed_at = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            status = "SELF_HOSTED_COMPLETED"
          } | ConvertTo-Json -Compress
          Set-Content -Path research/TRIGGER_PROBE.json -Value $probe -Encoding utf8

      - name: Commit research results only
        shell: powershell
        run: |
          git config user.name "proypers-research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add research/TRIGGER_PROBE.json research/RESEARCH_STATE.md research/experiment-ledger.jsonl research/results/frontloaded_walkforward.json research/results/checkpoint.json
          if (git diff --cached --quiet) {
            Write-Host "No research changes to persist."
          } else {
            git commit -m "research: persist autonomous batch [research-result]"
            git pull --rebase origin research/post-signal-continuation-autopsy
            git push origin HEAD:research/post-signal-continuation-autopsy
          }

      - name: Research guard
        shell: powershell
        run: Write-Host "RESEARCH ONLY - no production deploy, no order execution, no trading credentials."

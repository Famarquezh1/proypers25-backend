name: Export Spot realized performance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/exportSpotPerformance.js'
      - 'backend/tests/exportSpotPerformance.test.js'
      - '.github/workflows/export-spot-performance.yml'
  schedule:
    - cron: '20 */6 * * *'

permissions:
  contents: write

concurrency:
  group: spot-performance-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend production dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Export canonical Spot performance
        working-directory: backend
        env:
          GOOGLE_CLOUD_PROJECT: proypers2025
          GCLOUD_PROJECT: proypers2025
          OUTPUT_PATH: /tmp/performance/ops/latest-performance.json
          SPOT_PERFORMANCE_LIMIT: '500'
        run: |
          set -euo pipefail
          node --check scripts/exportSpotPerformance.js
          node tests/exportSpotPerformance.test.js
          node scripts/exportSpotPerformance.js
          jq -e '
            .source == "FIRESTORE_CANONICAL_SPOT_LEDGER" and
            .real_mode == true and
            .spot_only == true and
            (.summary.realized_pnl_usdt | type == "number") and
            (.summary.verified_trades | type == "number") and
            (.recent_closed_trades | type == "array")
          ' /tmp/performance/ops/latest-performance.json >/dev/null

      - name: Publish sanitized performance branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "proypers-performance-bot"
          git config user.email "actions@github.com"

          if git ls-remote --exit-code --heads origin performance-observability >/dev/null 2>&1; then
            git fetch origin performance-observability
            git switch -C performance-observability origin/performance-observability
          else
            git switch --orphan performance-observability
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p ops
          cp /tmp/performance/ops/latest-performance.json ops/latest-performance.json
          cat > README.md <<'EOF'
          # Proypers25 Spot Performance

          Resumen sanitizado del ledger canónico de operaciones Spot reales.

          Fuente: `real_spot_execution_results` y `real_spot_config/balance`.
          No contiene secretos, API keys ni credenciales.

          Archivo:
          - `ops/latest-performance.json`
          EOF

          git add README.md ops/latest-performance.json
          if git diff --cached --quiet; then
            echo "No performance changes to publish."
            exit 0
          fi
          git commit -m "chore(performance): refresh realized Spot ledger summary"
          git push origin HEAD:performance-observability

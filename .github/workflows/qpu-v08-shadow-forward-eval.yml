name: QPU V08 Shadow Forward Eval

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/lib/github_evidence.py'
      - 'research/lib/test_github_evidence.py'
      - 'backend/scripts/github-qpu-v08-shadow-forward-eval.js'
      - '.github/workflows/qpu-v08-shadow-forward-eval.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: qpu-v08-shadow-forward-eval
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore immutable research evidence
        uses: actions/cache/restore@v4
        with:
          path: .research-cache/github
          key: qpu-v08-shadow-forward-eval-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: qpu-v08-shadow-forward-eval-v1-
      - name: Download recent shadow decisions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python research/lib/github_evidence.py --workflow qpu-v08-consensus-shadow.yml --prefix qpu-v08-consensus-shadow- --member qpu-v08-shadow-decision.json --output .qpu-v08-shadow-decisions
      - name: Evaluate matured decisions
        run: node backend/scripts/github-qpu-v08-shadow-forward-eval.js .qpu-v08-shadow-decisions qpu-v08-shadow-forward-eval.json
      - name: Guard research isolation
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"shadow_only": true' qpu-v08-shadow-forward-eval.json
          grep -q '"no_order_created": true' qpu-v08-shadow-forward-eval.json
          ! grep -Eq 'BINANCE_(API|SECRET)_KEY|placeOrder|createOrder|withdraw|api/v3/order' backend/scripts/github-qpu-v08-shadow-forward-eval.js
      - uses: actions/upload-artifact@v4
        with:
          name: qpu-v08-shadow-forward-eval-${{ github.run_id }}
          path: qpu-v08-shadow-forward-eval.json
          retention-days: 30
      - name: Save evidence checkpoint
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .research-cache/github
          key: qpu-v08-shadow-forward-eval-v1-${{ github.run_id }}-${{ github.run_attempt }}

name: Frozen Entry Exit Research
on:
  pull_request:
    paths: ['backend/scripts/github-frozen-entry-exit-research.js','.github/workflows/frozen-entry-exit-research.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check backend/scripts/github-frozen-entry-exit-research.js
      - run: node backend/scripts/github-frozen-entry-exit-research.js
      - uses: actions/upload-artifact@v4
        with: {name: frozen-entry-exit-research, path: frozen-entry-exit-research.json, retention-days: 30}

name: Spot V10 Hunter Production Check

on:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/github-spot-microflow-trainer-v10.js'
      - 'backend/scripts/github-spot-microflow-hunter-v10.js'
      - 'backend/scripts/github-spot-manual-execution-v10-aware.js'
      - 'backend/services/spotAssetClassification.js'
      - 'backend/services/spotEntryBurstGate.js'
      - 'backend/services/spotConvictionSizing.js'
      - 'backend/tests/spotAssetClassification.test.js'
      - 'backend/tests/spotEntryBurstGate.test.js'
      - 'backend/tests/spotConvictionSizing.test.js'
      - 'backend/scripts/github-spot-auto-exit-legacy-v10-aware.js'
      - 'backend/scripts/github-spot-auto-exit.js'
      - '.github/workflows/spot-manual-approval.yml'
      - '.github/workflows/spot-microflow-hunter-v10.yml'
      - '.github/workflows/spot-v10-hunter-production-check.yml'
      - 'rearm_config.json'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      V8_MAX_SYMBOLS: '40'
      V8_MIN_QV: '200000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax checks
        run: |
          node --check backend/scripts/github-spot-microflow-hunter-v10.js
          node --check backend/scripts/github-spot-manual-execution-v10-aware.js
          node --check backend/services/spotAssetClassification.js
          node --check backend/services/spotEntryBurstGate.js
          node --check backend/services/spotConvictionSizing.js
          node --check backend/tests/spotAssetClassification.test.js
          node --check backend/tests/spotEntryBurstGate.test.js
          node --check backend/tests/spotConvictionSizing.test.js
          node --check backend/scripts/github-spot-auto-exit-legacy-v10-aware.js
          node --check backend/scripts/github-spot-auto-exit.js

      - name: Selective entry gate tests
        run: |
          node backend/tests/spotEntryBurstGate.test.js
          node backend/tests/spotAssetClassification.test.js
          node backend/tests/spotConvictionSizing.test.js
      - name: V10 exit wrapper patch compatibility
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('backend/scripts/github-spot-auto-exit-legacy.js', 'utf8').replace(/\r\n/g, '\n');
          const required = [
            "const buy = managedBuys[managedBuys.length - 1];",
            "const { stopPrice, protection, tickSize } = protectionParams(info, effectiveEntryPrice, recentHigh);",
            "let reason = null;\n    if (currentPrice <= stopPrice) reason = protection === 'TRAILING' ? 'TRAILING_STOP' : protection === 'BREAK_EVEN' ? 'BREAK_EVEN_STOP' : 'STOP_LOSS';\n    else if (growthExit.reason) reason = growthExit.reason;\n    else if (ageHours >= STALE_TIMEOUT_HOURS && gainPct <= STALE_TIMEOUT_MAX_GAIN_PCT) reason = 'TIMEOUT_STALE';",
            "if (openProtect && !['TIMEOUT_STALE', 'MOMENTUM_FAILURE', 'NO_PROGRESS'].includes(reason)) {"
          ];
          for (const target of required) {
            if (!source.includes(target)) throw new Error(`V10 wrapper patch target missing: ${target.slice(0, 90)}`);
          }
          console.log('V10 wrapper patch targets compatible with legacy exit source');
          NODE


      - name: Guard production invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const MAX_USDT = 50" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -q "const MIN_USDT = 5" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -q "DUPLICATE_POSITION_USDT = 15" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -q "LEVERAGED_GITHUB_MAX_USDT = LEVERAGED_POSITION_USDT" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -q "NORMAL_POSITION_USDT = 15" backend/services/spotConvictionSizing.js
          grep -q "HIGH_CONVICTION_POSITION_USDT = 30" backend/services/spotConvictionSizing.js
          grep -q "EXCEPTIONAL_CONVICTION_POSITION_USDT = 50" backend/services/spotConvictionSizing.js
          grep -q "V10_EXCEPTIONAL_CONVICTION_POSITION_USDT = 40" backend/services/spotConvictionSizing.js
          grep -q "LEVERAGED_POSITION_USDT = 5" backend/services/spotConvictionSizing.js
          grep -q "MIN_CASH_RESERVE_USDT = 40" backend/services/spotConvictionSizing.js
          grep -q "LEVERAGED_GITHUB_MIN_V61_SCORE" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -q "LEVERAGED_HARD_STOP_PCT = 0.03" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -q "classifySpotAsset" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -q "assetClassification.is_leveraged" backend/scripts/github-spot-manual-execution-v10-aware.js
          ! grep -q "MAX_TOTAL_CAPITAL_USDT" backend/scripts/github-spot-manual-execution-v10-aware.js
          ! grep -q "MAX_OPEN_POSITIONS" backend/scripts/github-spot-manual-execution-v10-aware.js
          ! grep -q "Managed Spot capital limit would be exceeded" backend/scripts/github-spot-manual-execution-v10-aware.js
          ! grep -q "Managed Spot position limit reached" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -q "evaluateSpotEntryBurstGate" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -q "SAME_SYMBOL_OPEN" backend/services/spotEntryBurstGate.js
          grep -q "ENTRY_COOLDOWN" backend/services/spotEntryBurstGate.js
          grep -q "CORRELATED_ENTRY" backend/services/spotEntryBurstGate.js
          grep -q "CORE_QUALITY_REQUIRED" backend/services/spotEntryBurstGate.js
          grep -q "resolveConvictionPosition" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -q "SIGNAL_MICROFLOW_SCORE" .github/workflows/spot-manual-approval.yml
          grep -q "V10_HARD_STOP_PCT = 0.012" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -q "V10_TAKE_PROFIT" backend/scripts/github-spot-auto-exit-legacy-v10-aware.js
          grep -q "V10_TIMEOUT_3H" backend/scripts/github-spot-auto-exit-legacy-v10-aware.js
          grep -q "LANE=\${LANE:-CORE}" .github/workflows/spot-manual-approval.yml
          grep -q "github-spot-manual-execution-v10-aware.js" .github/workflows/spot-manual-approval.yml
          grep -q "cron: '7,22,37,52 \* \* \* \*'" .github/workflows/spot-microflow-hunter-v10.yml
          grep -q "CORE V4.2 5m: intacto" .github/workflows/spot-microflow-hunter-v10.yml
          echo 'V10 lane invariants preserved: CORE requires high quality, CORE sizing 15/30/50 with NORMAL blocked from real entry, V10 exceptional capped at 40 USDT, 5 USDT leveraged cap, cash reserve, stronger leveraged entry score and tighter leveraged stop.'

      - name: Read-only V10 Hunter live smoke
        shell: bash
        run: |
          set -euo pipefail
          RESULT=$(node backend/scripts/github-spot-microflow-hunter-v10.js)
          printf '%s\n' "$RESULT"
          test "$(printf '%s' "$RESULT" | jq -r '.ok // false')" = "true"
          test "$(printf '%s' "$RESULT" | jq -r '.lane // ""')" = "V10_HUNTER"
          echo 'Read-only smoke completed; no issue/order is created by this script.'

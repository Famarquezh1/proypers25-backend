name: Confirm Abort Bounded Research
on:
  pull_request:
    paths: ['backend/scripts/github-confirm-abort-bounded.js','.github/workflows/confirm-abort-bounded.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check backend/scripts/github-confirm-abort-bounded.js
      - run: node backend/scripts/github-confirm-abort-bounded.js
      - uses: actions/upload-artifact@v4
        with: {name: confirm-abort-bounded, path: confirm-abort-bounded.json, retention-days: 30}

name: Proypers25 Supervisor Local

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: proypers25-supervisor-local
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only workflow supervisor
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Check recent production and research runs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GH_REPO/actions/runs?per_page=100"
          $runs = (Invoke-RestMethod -Uri $uri -Headers $headers).workflow_runs
          $targets = @('Spot Auto Exit Local', 'Spot V6.1 Production Check', 'Spot V10 Hunter Production Check', 'Research Shadow Causal Audit Tests')
          $lines = @('# Proypers25 supervisor', '', "Checked UTC: $([DateTime]::UtcNow.ToString('u'))", '')
          $failures = @()
          foreach ($name in $targets) {
            $latest = $runs | Where-Object { $_.name -eq $name -and $_.head_branch -eq 'main' -and $_.status -eq 'completed' } | Select-Object -First 1
            if ($null -eq $latest) {
              $lines += "- $name : NO_COMPLETED_MAIN_RUN_IN_LAST_100"
              continue
            }
            $lines += "- $name : $($latest.conclusion) | $($latest.html_url) | $($latest.updated_at)"
            if ($latest.conclusion -ne 'success') { $failures += $latest }
          }
          $lines += ''
          $lines += 'This report is read-only. It does not certify Binance position protection or profitability.'
          $body = $lines -join "`n"
          Write-Host $body
          if ($failures.Count -eq 0) { exit 0 }
          $title = '[SPOT SUPERVISOR] Workflow failures'
          $issuesUri = "https://api.github.com/repos/$env:GH_REPO/issues?state=open&per_page=100"
          $existing = @(Invoke-RestMethod -Uri $issuesUri -Headers $headers | Where-Object { $_.title -eq $title } | Select-Object -First 1)
          $payload = @{ body = $body } | ConvertTo-Json -Compress
          if ($existing.Count -gt 0) {
            Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/$env:GH_REPO/issues/$($existing[0].number)" -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
          } else {
            $payload = @{ title = $title; body = $body } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GH_REPO/issues" -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
          }
          Write-Warning "Supervisor detected $($failures.Count) failed workflow(s); see consolidated issue."

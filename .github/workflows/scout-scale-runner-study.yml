name: Scout Scale Runner Study

on:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/github-scout-scale-runner-study.js'
      - '.github/workflows/scout-scale-runner-study.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SSR_START: '2026-04-01T00:00:00Z'
      SSR_END: '2026-09-01T00:00:00Z'
      SSR_MAX_ROWS: '450'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Safety check
        run: |
          node --check backend/scripts/github-scout-scale-runner-study.js
          ! grep -Eq 'api/v3/order|BINANCE_API_KEY|BINANCE_SECRET|fapi/v1/order' backend/scripts/github-scout-scale-runner-study.js
      - name: Run scout confirm scale runner study
        run: node backend/scripts/github-scout-scale-runner-study.js

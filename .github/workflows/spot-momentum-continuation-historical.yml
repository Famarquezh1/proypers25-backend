name: Spot Momentum Continuation Historical

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/services/spotMomentumContinuation.js'
      - 'backend/scripts/train-spot-momentum-continuation-historical.js'
      - '.github/workflows/spot-momentum-continuation-historical.yml'

permissions:
  contents: read

concurrency:
  group: spot-momentum-continuation-historical
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HIST_POOL_SIZE: '60'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guard historical research
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/services/spotMomentumContinuation.js
          node --check backend/scripts/train-spot-momentum-continuation-historical.js
          node backend/tests/spotMomentumContinuation.test.js
          grep -q "production_mutation:false" backend/scripts/train-spot-momentum-continuation-historical.js
          ! grep -q "api/v3/order\|BINANCE_SECRET\|withdraw" backend/scripts/train-spot-momentum-continuation-historical.js
      - name: Train and confirm continuation factor
        run: node backend/scripts/train-spot-momentum-continuation-historical.js
      - name: Upload historical evidence
        uses: actions/upload-artifact@v4
        with:
          name: spot-momentum-continuation-historical-${{ github.run_id }}
          path: backend/training-output/spot-momentum-continuation-historical.json
          retention-days: 30
      - name: Summary
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const r=require('./backend/training-output/spot-momentum-continuation-historical.json');
          console.log('### Momentum Continuation — historical');
          console.log(`- Selected dev policy: ${r.selected_development ? `rank=${r.selected_development.rank_weight}, size=${r.selected_development.size_policy}` : 'none'}`);
          console.log(`- Confirmation pass: ${r.confirmation_pass}`);
          console.log(`- Recommendation: ${r.recommendation}`);
          console.log(`- Experiment mode: ${r.experiment?.mode || 'unknown'}; production changed: ${r.experiment?.production_changed === true}`);
          if(r.confirmation_delta) {
            console.log(`- Δ +5% precision: ${(100*r.confirmation_delta.winner5_precision).toFixed(2)} pp`);
            console.log(`- Δ net growth: ${(100*r.confirmation_delta.net_growth).toFixed(3)} pp`);
            console.log(`- Δ avg net return: ${(100*r.confirmation_delta.avg_net_ret).toFixed(3)} pp`);
            console.log(`- Δ max drawdown: ${(100*r.confirmation_delta.max_drawdown).toFixed(3)} pp`);
          }
          NODE

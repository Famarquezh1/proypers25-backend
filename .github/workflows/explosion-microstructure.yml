name: Explosion Microstructure
on:
  pull_request:
    paths: ['backend/scripts/github-explosion-microstructure.js','.github/workflows/explosion-microstructure.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check backend/scripts/github-explosion-microstructure.js
      - run: node backend/scripts/github-explosion-microstructure.js
      - uses: actions/upload-artifact@v4
        with: {name: explosion-microstructure, path: explosion-microstructure.json, retention-days: 30}

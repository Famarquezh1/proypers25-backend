name: Explosion Trajectory Fingerprint
on:
  pull_request:
    paths: ['backend/scripts/github-explosion-trajectory-fingerprint.js','.github/workflows/explosion-trajectory-fingerprint.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check backend/scripts/github-explosion-trajectory-fingerprint.js
      - run: node backend/scripts/github-explosion-trajectory-fingerprint.js
      - uses: actions/upload-artifact@v4
        with: {name: trajectory-fingerprint, path: trajectory-fingerprint.json, retention-days: 30}

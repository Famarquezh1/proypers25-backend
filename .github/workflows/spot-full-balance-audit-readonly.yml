name: Spot Full Balance Audit Read Only

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'backend/scripts/audit-spot-balances-readonly.js'
      - 'backend/scripts/github-spot-orphan-protect.js'
      - 'backend/services/spotOrphanProtection.js'
      - 'backend/tests/spotOrphanProtection.test.js'
      - '.github/workflows/spot-full-balance-audit-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'backend/scripts/audit-spot-balances-readonly.js'
      - '.github/workflows/spot-full-balance-audit-readonly.yml'

permissions:
  contents: read

jobs:
  audit:
    name: GET-only Binance Spot balance and open-order audit
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    env:
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY || secrets.BINANCE_SECRET || secrets.BINANCE_API_SECRET || secrets.BINANCE_FUTURES_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        shell: powershell
        run: node --check backend/scripts/audit-spot-balances-readonly.js
      - name: Assert audit contains no Binance write method
        shell: powershell
        run: |
          $content = Get-Content backend/scripts/audit-spot-balances-readonly.js -Raw
          if ($content -match "signed\s*\([^\)]*'POST'" -or $content -match "signed\s*\([^\)]*'DELETE'" -or $content -match "method:\s*'POST'" -or $content -match "method:\s*'DELETE'") { throw 'Read-only audit contains a write method' }
          Write-Host 'GET-only audit guard OK'
      - name: Audit every nonzero Spot balance and active lock without trading
        shell: powershell
        run: node backend/scripts/audit-spot-balances-readonly.js

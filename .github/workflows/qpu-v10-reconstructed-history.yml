name: QPU V10 Reconstructed History

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/github-qpu-v10-reconstructed-history.js'
      - '.github/workflows/qpu-v10-reconstructed-history.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QPU_V10_DAYS: '30'
      V8_MAX_SYMBOLS: '40'
      V8_MIN_QV: '200000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct causal V10 history
        run: node backend/scripts/github-qpu-v10-reconstructed-history.js qpu-v10-reconstructed.jsonl qpu-v10-reconstructed.meta.json
      - name: Show metadata
        run: cat qpu-v10-reconstructed.meta.json
      - uses: actions/upload-artifact@v4
        with:
          name: qpu-v10-reconstructed-${{ github.run_id }}
          path: |
            qpu-v10-reconstructed.jsonl
            qpu-v10-reconstructed.meta.json
          retention-days: 30

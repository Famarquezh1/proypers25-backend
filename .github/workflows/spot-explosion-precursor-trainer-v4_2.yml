name: Spot Explosion Precursor Trainer V4.2

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/scripts/github-spot-explosion-precursor-trainer-v4_2.js'
      - '.github/workflows/spot-explosion-precursor-trainer-v4_2.yml'

permissions:
  contents: read

concurrency:
  group: spot-explosion-precursor-trainer-v4-2
  cancel-in-progress: true

jobs:
  train:
    name: Explosion V4.2 ${{ matrix.days }}d
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        days: [30, 45, 60]
    env:
      TRAIN_LOOKBACK_DAYS: ${{ matrix.days }}
      TRAIN_MAX_SYMBOLS: '24'
      MIN_HIST_QUOTE_VOL_24H: '500000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run hierarchical precursor trainer
        working-directory: backend
        run: node scripts/github-spot-explosion-precursor-trainer-v4_2.js

      - name: Upload V4.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spot-explosion-v4-2-${{ matrix.days }}d-${{ github.run_id }}
          path: backend/training-output/spot-explosion-v4_2-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: V4.2 window summary
        if: success()
        working-directory: backend
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const r=require('./training-output/spot-explosion-v4_2-report.json');
          console.log(`### V4.2 hierarchical ${r.lookbackDays}d`);
          console.log(`- Gate: ${r.productionGate.pass ? 'PASS' : 'HOLD'}`);
          console.log(`- Test trades/30d: ${r.test.portfolio.tradesPer30.toFixed(2)}`);
          console.log(`- Test growth: ${(r.test.portfolio.netGrowth*100).toFixed(2)}%`);
          console.log(`- Test DD: ${(r.test.portfolio.maxDrawdown*100).toFixed(2)}%`);
          console.log(`- Hit +10: ${(r.test.diag.hit10*100).toFixed(2)}%`);
          console.log(`- Hit +20: ${(r.test.diag.hit20*100).toFixed(2)}%`);
          console.log(`- Hit +40: ${(r.test.diag.hit40*100).toFixed(2)}%`);
          console.log(`- Hit +80: ${(r.test.diag.hit80*100).toFixed(2)}%`);
          NODE

  consolidate:
    name: Explosion V4.2 cross-window gate
    needs: train
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download V4.2 evidence
        uses: actions/download-artifact@v4
        with:
          pattern: spot-explosion-v4-2-*-${{ github.run_id }}
          path: v4-2-combined
          merge-multiple: false

      - name: Consolidate V4.2
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const reports=[];
          function walk(d){if(!fs.existsSync(d))return;for(const n of fs.readdirSync(d)){const p=path.join(d,n),s=fs.statSync(p);if(s.isDirectory())walk(p);else if(n==='spot-explosion-v4_2-report.json')reports.push(JSON.parse(fs.readFileSync(p,'utf8')));}}
          walk('v4-2-combined');reports.sort((a,b)=>a.lookbackDays-b.lookbackDays);
          const windows=reports.map(r=>({days:r.lookbackDays,gate:r.productionGate.pass,growth:r.test.portfolio.netGrowth,trades30:r.test.portfolio.tradesPer30,dd:r.test.portfolio.maxDrawdown,hit10:r.test.diag.hit10,hit20:r.test.diag.hit20,hit40:r.test.diag.hit40,hit80:r.test.diag.hit80}));
          const passCount=windows.filter(x=>x.gate).length;
          const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
          const summary={generatedAt:new Date().toISOString(),version:'V4.2',windows,productionGate:{pass:reports.length===3&&passCount>=2&&avg(windows.map(x=>x.growth))>0,reason:reports.length===3&&passCount>=2?'hierarchy robust in at least 2/3 short windows':'HOLD: hierarchy not robust enough across 30/45/60d'}};
          fs.writeFileSync('spot-explosion-v4_2-cross-window-summary.json',JSON.stringify(summary,null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`\n### V4.2 cross-window\n- Passing windows: ${passCount}/${reports.length}\n- Gate: ${summary.productionGate.pass?'PASS':'HOLD'}\n`);
          NODE

      - name: Upload V4.2 consolidated evidence
        uses: actions/upload-artifact@v4
        with:
          name: spot-explosion-v4-2-cross-window-${{ github.run_id }}
          path: spot-explosion-v4_2-cross-window-summary.json
          retention-days: 14

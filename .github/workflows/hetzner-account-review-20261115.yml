name: Hetzner bounded account review
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hetzner-account-review-20261115.yml'
permissions:
  contents: read
concurrency:
  group: hetzner-account-review-readonly
  cancel-in-progress: false
jobs:
  review:
    if: github.actor == 'Famarquezh1'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b4738a9261bf11545fc75fe14b6613607173e217
          persist-credentials: false
      - name: Read account balances orders fills and fees
        env:
          BOOTSTRAP_SSH_KEY: ${{ secrets.HETZNER_BOOTSTRAP_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --check deploy/hetzner/research/read-account-20261115.cjs
          umask 077
          WORKDIR=$(mktemp -d)
          trap 'rm -rf "$WORKDIR"' EXIT
          printf '%s\n' "$BOOTSTRAP_SSH_KEY" > "$WORKDIR/key"
          unset BOOTSTRAP_SSH_KEY
          ssh -i "$WORKDIR/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$WORKDIR/known_hosts" -o ConnectTimeout=10 deploy@89.167.5.87 'sudo /usr/bin/node -' < deploy/hetzner/research/read-account-20261115.cjs | tee "$WORKDIR/review.log"
          grep -q '^ACCOUNT_REVIEW ' "$WORKDIR/review.log"

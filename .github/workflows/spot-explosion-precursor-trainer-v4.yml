name: Spot Explosion Precursor Trainer V4

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/scripts/github-spot-explosion-precursor-trainer-v4.js'
      - '.github/workflows/spot-explosion-precursor-trainer-v4.yml'

permissions:
  contents: read

concurrency:
  group: spot-explosion-precursor-trainer-v4
  cancel-in-progress: true

jobs:
  train:
    name: Explosion precursor ${{ matrix.days }}d
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        days: [30, 60]
    env:
      TRAIN_LOOKBACK_DAYS: ${{ matrix.days }}
      TRAIN_MAX_SYMBOLS: '20'
      MIN_HIST_QUOTE_VOL_24H: '500000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run explosion precursor trainer
        working-directory: backend
        run: node scripts/github-spot-explosion-precursor-trainer-v4.js

      - name: Upload V4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spot-explosion-v4-${{ matrix.days }}d-${{ github.run_id }}
          path: |
            backend/training-output/spot-explosion-v4-report.json
            backend/training-output/spot-explosion-v4-champion.json
          if-no-files-found: warn
          retention-days: 14

      - name: V4 window summary
        if: success()
        working-directory: backend
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const r=require('./training-output/spot-explosion-v4-report.json');
          console.log(`### Explosion precursor ${r.lookback_days}d`);
          console.log(`- Samples: ${r.samples}`);
          console.log(`- Champion: ${r.champion?.agent || 'none'}`);
          console.log(`- Gate: ${r.production_gate.pass ? 'PASS' : 'HOLD'}`);
          if(r.champion){
            console.log(`- Trades/30d: ${r.champion.rotation.trades_per_30d.toFixed(2)}`);
            console.log(`- Rotation growth: ${(r.champion.rotation.net_growth*100).toFixed(2)}%`);
            console.log(`- DD: ${(r.champion.rotation.max_drawdown*100).toFixed(2)}%`);
            console.log(`- Hit +20%: ${(r.champion.test.hit20*100).toFixed(2)}%`);
            console.log(`- Hit +40%: ${(r.champion.test.hit40*100).toFixed(2)}%`);
          }
          NODE

  consolidate:
    name: Explosion V4 cross-window comparison
    needs: train
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download V4 evidence
        uses: actions/download-artifact@v4
        with:
          pattern: spot-explosion-v4-*-${{ github.run_id }}
          path: v4-combined
          merge-multiple: false

      - name: Consolidate V4
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const reports=[];
          function walk(d){if(!fs.existsSync(d))return;for(const n of fs.readdirSync(d)){const p=path.join(d,n),s=fs.statSync(p);if(s.isDirectory())walk(p);else if(n==='spot-explosion-v4-report.json')reports.push(JSON.parse(fs.readFileSync(p,'utf8')));}}
          walk('v4-combined'); reports.sort((a,b)=>a.lookback_days-b.lookback_days);
          const byAgent={};
          for(const r of reports){for(const x of r.results){const a=byAgent[x.agent]||(byAgent[x.agent]={agent:x.agent,windows:0,passLike:0,rotation:[],hit20:[],hit40:[],trades30:[],dd:[]});a.windows++;a.rotation.push(x.rotation.net_growth);a.hit20.push(x.test.hit20);a.hit40.push(x.test.hit40);a.trades30.push(x.rotation.trades_per_30d);a.dd.push(x.rotation.max_drawdown);if(x.rotation.net_growth>0&&x.rotation.trades_per_30d>=4&&x.rotation.max_drawdown>-0.25&&x.test.hit20>0)a.passLike++;}}
          const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
          const ranking=Object.values(byAgent).map(a=>({agent:a.agent,windows:a.windows,robust_windows:a.passLike,avg_rotation_growth:avg(a.rotation),avg_hit20:avg(a.hit20),avg_hit40:avg(a.hit40),avg_trades_per_30d:avg(a.trades30),worst_dd:Math.min(...a.dd)})).sort((a,b)=>(b.robust_windows-a.robust_windows)||(b.avg_rotation_growth-a.avg_rotation_growth)||(b.avg_hit20-a.avg_hit20));
          const stable=ranking.filter(x=>x.windows===reports.length&&x.robust_windows===reports.length&&x.avg_trades_per_30d>=4&&x.avg_rotation_growth>0&&x.worst_dd>-0.25);
          const summary={generated_at:new Date().toISOString(),windows:reports.map(r=>({days:r.lookback_days,champion:r.champion?.agent||null,gate:r.production_gate})),ranking,stable_champions:stable,production_gate:{pass:stable.length>0,reason:stable.length?'stable short-horizon precursor champion across 30d/60d':'HOLD: no short-horizon precursor champion robust across both windows'}};
          fs.writeFileSync('spot-explosion-v4-cross-window-summary.json',JSON.stringify(summary,null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n### Explosion V4 cross-window\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`- Stable champions: ${stable.map(x=>x.agent).join(', ')||'none'}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`- Gate: ${summary.production_gate.pass?'PASS':'HOLD'}\n`);
          for(const x of ranking.slice(0,5))fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`- ${x.agent}: rotation ${(x.avg_rotation_growth*100).toFixed(2)}%, +20 ${(x.avg_hit20*100).toFixed(1)}%, +40 ${(x.avg_hit40*100).toFixed(1)}%, trades/30d ${x.avg_trades_per_30d.toFixed(1)}, robust ${x.robust_windows}/${x.windows}\n`);
          NODE

      - name: Upload V4 consolidated evidence
        uses: actions/upload-artifact@v4
        with:
          name: spot-explosion-v4-cross-window-${{ github.run_id }}
          path: spot-explosion-v4-cross-window-summary.json
          retention-days: 14

name: Research Hazard Hosted Once

on:
  push:
    branches: [research/post-signal-continuation-autopsy]
    paths:
      - '.github/workflows/research-hazard-hosted-once.yml'

permissions:
  contents: write
  issues: read

jobs:
  hazard-once:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESEARCH_EXECUTION_ENV: github-hosted-provisional-hazard
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/post-signal-continuation-autopsy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safety preflight
        shell: bash
        run: |
          node --check backend/scripts/github-competing-hazard-bench.js
          node --check backend/scripts/persist-hazard-research.js
          if grep -E 'api/v3/order|fapi/v1/order|BINANCE_API_KEY|BINANCE_SECRET|firebase-admin' backend/scripts/github-competing-hazard-bench.js; then
            echo "Forbidden execution capability detected"
            exit 1
          fi
          mkdir -p research/results
      - name: Run competing-risk hazard hypothesis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node backend/scripts/github-competing-hazard-bench.js | tee research/results/competing_hazard.json
      - name: Persist hazard checkpoint
        run: node backend/scripts/persist-hazard-research.js research/results/competing_hazard.json | tee research/results/checkpoint.json
      - name: Commit hazard evidence
        shell: bash
        run: |
          git config user.name "proypers-research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add research/RESEARCH_STATE.md research/experiment-ledger.jsonl research/results/competing_hazard.json research/results/checkpoint.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "research: provisional competing-hazard result [research-result]"
            git pull --rebase origin research/post-signal-continuation-autopsy
            git push origin HEAD:research/post-signal-continuation-autopsy
          fi

name: Spot V6.1 Production Check

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/scripts/github-spot-manual-execution.js'
      - 'backend/scripts/github-spot-manual-execution-v10-aware.js'
      - 'backend/scripts/github-spot-v61-protect.js'
      - 'backend/scripts/github-spot-auto-exit.js'
      - 'backend/scripts/github-spot-auto-exit-legacy.js'
      - 'backend/scripts/github-spot-auto-exit-legacy-v10-aware.js'
      - 'backend/scripts/github-spot-orphan-protect.js'
      - 'backend/services/spotOrphanProtection.js'
      - 'backend/services/localPretradeGuard.js'
      - 'backend/services/marketManipulationRisk.js'
      - 'backend/tests/spotOrphanProtection.test.js'
      - 'backend/tests/localPretradeGuard.test.js'
      - 'backend/tests/marketManipulationRisk.test.js'
      - '.github/workflows/spot-v61-production-check.yml'

permissions:
  contents: read

jobs:
  syntax:
    name: Validate V6.1 production scripts
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check backend/scripts/github-spot-manual-execution.js
          node --check backend/scripts/github-spot-manual-execution-v10-aware.js
          node --check backend/scripts/github-spot-v61-protect.js
          node --check backend/scripts/github-spot-auto-exit.js
          node --check backend/scripts/github-spot-auto-exit-legacy.js
          node --check backend/scripts/github-spot-auto-exit-legacy-v10-aware.js
          node --check backend/scripts/github-spot-orphan-protect.js
          node --check backend/services/spotOrphanProtection.js
          node --check backend/services/localPretradeGuard.js
          node --check backend/services/marketManipulationRisk.js
      - name: Orphan balance policy tests
        run: node backend/tests/spotOrphanProtection.test.js
      - name: Local pretrade guard tests
        run: node backend/tests/localPretradeGuard.test.js
      - name: Defensive manipulation risk tests
        run: node backend/tests/marketManipulationRisk.test.js
      - name: Confirm production wiring
        run: |
          set -euo pipefail
          grep -q "github-spot-v61-protect.js" backend/scripts/github-spot-auto-exit.js
          grep -q "github-spot-auto-exit-legacy-v10-aware.js" backend/scripts/github-spot-auto-exit.js
          grep -q "github-spot-orphan-protect.js" backend/scripts/github-spot-auto-exit.js
          grep -Fq ".replace(/\\r\\n/g, '\\n')" backend/scripts/github-spot-auto-exit-legacy-v10-aware.js
          grep -Fq 'proypers-gh-protect-v61-${Date.now().toString(36)}' backend/scripts/github-spot-v61-protect.js
          grep -Fq "'XEC'" backend/scripts/github-spot-orphan-protect.js
          grep -q "ORPHAN_PROTECT_OK" backend/scripts/github-spot-orphan-protect.js
          grep -q "V61_SCORE_ANCHOR" backend/scripts/github-spot-manual-execution.js
          grep -q "runLocalPretradeGuard" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -q "manipulation_risk=" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -q "local-pretrade-memory.jsonl" backend/services/localPretradeGuard.js
          grep -q "evaluateManipulationRisk" backend/services/localPretradeGuard.js
          grep -q "MANIPULATION_RISK_HIGH" backend/services/marketManipulationRisk.js
          node - <<'NODE'
          const ids = [
            `proypers-gh-protect-v61-${Date.now().toString(36)}`,
            `proypers-gh-orphan-${Date.now().toString(36)}`,
            `proypers-gh-orphan-exit-${Date.now().toString(36)}`
          ];
          for (const id of ids) {
            if (id.length > 36 || !/^[a-zA-Z0-9-_]{1,36}$/.test(id)) throw new Error(`invalid Binance clientOrderId: ${id}`);
          }
          console.log(`protective clientOrderIds OK lengths=${ids.map((id) => id.length).join(',')}`);
          NODE
          echo "V6.1 production integration, local microvalidation, manipulation-risk defense, V10-aware wiring, and orphan protection OK"

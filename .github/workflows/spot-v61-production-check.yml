name: Spot V6.1 Production Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    paths:
      - 'backend/scripts/github-spot-manual-execution.js'
      - 'backend/scripts/github-spot-manual-execution-v10-aware.js'
      - 'backend/scripts/github-spot-v61-protect.js'
      - 'backend/scripts/github-spot-auto-exit.js'
      - 'backend/scripts/github-spot-auto-exit-legacy.js'
      - 'backend/scripts/github-spot-auto-exit-legacy-v10-aware.js'
      - 'backend/scripts/train-spot-exit-policy-v2.js'
      - 'backend/scripts/train-spot-exit-policy-intensive-v4.js'
      - 'backend/scripts/train-spot-core-exit-intensive-v4.js'
      - 'backend/tests/spotCoreExitIntensiveTraining.test.js'
      - '.github/workflows/spot-core-exit-intensive-learning.yml'
      - 'backend/tests/spotExitPolicyIntensiveTraining.test.js'
      - '.github/workflows/spot-exit-intensive-learning.yml'
      - 'backend/config/spot-exit-policy-v2.json'
      - 'backend/tests/spotExitPolicyHistoricalTraining.test.js'
      - '.github/workflows/spot-exit-policy-training.yml'
      - 'backend/scripts/github-spot-orphan-protect.js'
      - 'backend/services/spotOrphanProtection.js'
      - 'backend/services/localPretradeGuard.js'
      - 'backend/services/marketManipulationRisk.js'
      - 'backend/services/spotGrowthExitPolicy.js'
      - 'backend/services/spotProgressiveTrailing.js'
      - 'backend/services/spotManagedResidual.js'
      - 'backend/services/spotHighHistoryPolicy.js'
      - 'backend/tests/spotGrowthExitPolicy.test.js'
      - 'backend/tests/spotProgressiveTrailing.test.js'
      - 'backend/tests/spotManagedResidual.test.js'
      - 'backend/tests/spotHighHistoryPolicy.test.js'
      - 'backend/tests/spotOrphanProtection.test.js'
      - 'backend/tests/localPretradeGuard.test.js'
      - 'backend/tests/marketManipulationRisk.test.js'
      - '.github/workflows/spot-v61-production-check.yml'
      - '.github/workflows/spot-auto-exit-local.yml'

permissions:
  contents: read

jobs:
  syntax:
    name: Validate V6.1 production scripts
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check backend/scripts/github-spot-manual-execution.js
          node --check backend/scripts/github-spot-manual-execution-v10-aware.js
          node --check backend/scripts/github-spot-v61-protect.js
          node --check backend/scripts/github-spot-auto-exit.js
          node --check backend/scripts/github-spot-auto-exit-legacy.js
          node --check backend/scripts/github-spot-auto-exit-legacy-v10-aware.js
          node --check backend/scripts/train-spot-exit-policy-v2.js
          node --check backend/scripts/train-spot-exit-policy-intensive-v4.js
          node --check backend/scripts/train-spot-core-exit-intensive-v4.js
          node --check backend/tests/spotCoreExitIntensiveTraining.test.js
          node --check backend/tests/spotExitPolicyIntensiveTraining.test.js
          node --check backend/tests/spotExitPolicyHistoricalTraining.test.js
          node --check backend/scripts/github-spot-orphan-protect.js
          node --check backend/scripts/github-spot-orphan-audit.js
          node --check backend/services/spotOrphanProtection.js
          node --check backend/services/localPretradeGuard.js
          node --check backend/services/marketManipulationRisk.js
          node --check backend/services/spotGrowthExitPolicy.js
          node --check backend/services/spotProgressiveTrailing.js
          node --check backend/services/spotManagedResidual.js
          node --check backend/services/spotHighHistoryPolicy.js
          node --check backend/tests/spotGrowthExitPolicy.test.js
          node --check backend/tests/spotProgressiveTrailing.test.js
          node --check backend/tests/spotManagedResidual.test.js
          node --check backend/tests/spotHighHistoryPolicy.test.js
      - name: Historical exit-policy training tests
        run: |
          node backend/tests/spotExitPolicyHistoricalTraining.test.js
          node backend/tests/spotExitPolicyIntensiveTraining.test.js
          node backend/tests/spotCoreExitIntensiveTraining.test.js
      - name: Orphan balance policy tests
        run: node backend/tests/spotOrphanProtection.test.js
      - name: Local pretrade guard tests
        run: node backend/tests/localPretradeGuard.test.js
      - name: Defensive manipulation risk tests
        run: node backend/tests/marketManipulationRisk.test.js
      - name: Growth exit overlay tests
        run: |
          node backend/tests/spotGrowthExitPolicy.test.js
          node backend/tests/spotProgressiveTrailing.test.js
          node backend/tests/spotManagedResidual.test.js
          node backend/tests/spotHighHistoryPolicy.test.js
      - name: Confirm production wiring
        run: |
          set -euo pipefail
          grep -q "github-spot-v61-protect.js" backend/scripts/github-spot-auto-exit.js
          grep -q "workflow_run:" .github/workflows/spot-auto-exit-local.yml
          grep -q "Spot GitHub Radar" .github/workflows/spot-auto-exit-local.yml
          grep -q "Spot Microflow Hunter V10" .github/workflows/spot-auto-exit-local.yml
          grep -q "Spot Autonomous Validation & Execution" .github/workflows/spot-auto-exit-local.yml
          grep -q "github.event.workflow_run.conclusion == 'success'" .github/workflows/spot-auto-exit-local.yml
          grep -q "cancel-in-progress: false" .github/workflows/spot-auto-exit-local.yml
          grep -q "github-spot-auto-exit-legacy-v10-aware.js" backend/scripts/github-spot-auto-exit.js
          grep -q "isNotionalFilterError" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "decideCoreGrowthExit" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "resolveTrailingDistance" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "resolveManagedResidual" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "highHistoryCadence" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "HIGH_HISTORY symbol=" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "RESIDUAL_MONITOR_ACTIVE" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "EXIT_NATIVE_STALE" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "MOMENTUM_FAILURE" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "NO_PROGRESS" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "PROTECTION_SKIPPED_NOTIONAL" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "EXIT_SKIPPED_NOTIONAL" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "CURRENT_CORE_POLICY" backend/scripts/train-spot-exit-policy-v2.js
          grep -q '"mode": "PRODUCTION"' backend/config/spot-exit-policy-v2.json
          grep -q '"mfe": 0.018' backend/config/spot-exit-policy-v2.json
          grep -q '"confirm": 0.015' backend/config/spot-exit-policy-v2.json
          grep -q '"break_even_lock_pct": 0.003' backend/config/spot-exit-policy-v2.json
          grep -q '"trailing_distance_pct": 0.04' backend/config/spot-exit-policy-v2.json
          grep -q '"mfe_pct": 0.25, "distance_pct": 0.035' backend/config/spot-exit-policy-v2.json
          grep -q '"mfe_pct": 0.50, "distance_pct": 0.03' backend/config/spot-exit-policy-v2.json
          grep -q '"mfe_pct": 1.00, "distance_pct": 0.025' backend/config/spot-exit-policy-v2.json
          grep -q '"momentum_fail_hours": 1.5' backend/config/spot-exit-policy-v2.json
          grep -q '"momentum_fail_max_gain_pct": -0.015' backend/config/spot-exit-policy-v2.json
          grep -q '"no_progress_hours": 6' backend/config/spot-exit-policy-v2.json
          grep -q '"no_progress_max_gain_pct": 0.005' backend/config/spot-exit-policy-v2.json
          grep -q '"stale_timeout_hours": 24' backend/config/spot-exit-policy-v2.json
          grep -q "spot-exit-policy-v2.json" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "const CORE_EXIT = EXIT_POLICY.core" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "EXIT_POLICY.mode !== 'PRODUCTION'" backend/scripts/github-spot-auto-exit-legacy.js
          ! grep -q "BREAK_EVEN_LOCK_PCT = 0.002" backend/scripts/github-spot-auto-exit-legacy.js
          ! grep -q "TRAILING_DISTANCE_PCT = 0.06" backend/scripts/github-spot-auto-exit-legacy.js
          ! grep -q "STALE_TIMEOUT_HOURS = 18" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "spot-exit-policy-v2.json" backend/scripts/github-spot-v61-protect.js
          grep -q "const V61=EXIT_POLICY.v61" backend/scripts/github-spot-v61-protect.js
          grep -q "EXIT_POLICY.mode!=='PRODUCTION'" backend/scripts/github-spot-v61-protect.js
          ! grep -q "mfe:.008,dd:-.008,gap:.004,r15:-.001,confirm:.005" backend/scripts/github-spot-v61-protect.js
          grep -q "passed_for_production" backend/scripts/train-spot-exit-policy-v2.js
          grep -q "finalGate" backend/scripts/train-spot-exit-policy-intensive-v4.js
          grep -q "candidates_tested" backend/scripts/train-spot-exit-policy-intensive-v4.js
          grep -q "cadence_15m" backend/scripts/train-spot-exit-policy-intensive-v4.js
          grep -q "holdoutGate" backend/scripts/train-spot-core-exit-intensive-v4.js
          grep -q "candidates_tested" backend/scripts/train-spot-core-exit-intensive-v4.js
          grep -q "Entrenamiento: inmediato con histórico existente" .github/workflows/spot-exit-policy-training.yml
          grep -q "github-spot-orphan-protect.js" backend/scripts/github-spot-auto-exit.js
          grep -Fq ".replace(/\\r\\n/g, '\\n')" backend/scripts/github-spot-auto-exit-legacy-v10-aware.js
          grep -Fq 'proypers-gh-protect-v61-${Date.now().toString(36)}' backend/scripts/github-spot-v61-protect.js
          grep -Fq "'XEC'" backend/scripts/github-spot-orphan-protect.js
          grep -q "ORPHAN_PROTECT_OK" backend/scripts/github-spot-orphan-protect.js
          grep -q "managedCoreProtectionSymbols" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "isProypersSpotBuyOrder" backend/scripts/github-spot-auto-exit-legacy.js
          grep -q "ORPHAN_SKIP_CORE_MANAGED" backend/scripts/github-spot-orphan-protect.js
          grep -q "CORE_MANAGED_PROTECTION" backend/scripts/github-spot-orphan-audit.js
          grep -q "MANUAL_OR_UNKNOWN" backend/services/spotOrphanProtection.js
          grep -q "px25b_" backend/services/spotOrphanProtection.js
          grep -q "V61_SCORE_ANCHOR" backend/scripts/github-spot-manual-execution.js
          grep -q "runLocalPretradeGuard" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -q "manipulation_risk=" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -q "local-pretrade-memory.jsonl" backend/services/localPretradeGuard.js
          grep -q "evaluateManipulationRisk" backend/services/localPretradeGuard.js
          grep -q "MANIPULATION_RISK_HIGH" backend/services/marketManipulationRisk.js
          node - <<'NODE'
          const ids = [
            `proypers-gh-protect-v61-${Date.now().toString(36)}`,
            `proypers-gh-orphan-${Date.now().toString(36)}`,
            `proypers-gh-orphan-exit-${Date.now().toString(36)}`
          ];
          for (const id of ids) {
            if (id.length > 36 || !/^[a-zA-Z0-9-_]{1,36}$/.test(id)) throw new Error(`invalid Binance clientOrderId: ${id}`);
          }
          console.log(`protective clientOrderIds OK lengths=${ids.map((id) => id.length).join(',')}`);
          NODE
          echo "V6.1 production integration, local microvalidation, manipulation-risk defense, V10-aware wiring, and orphan protection OK"

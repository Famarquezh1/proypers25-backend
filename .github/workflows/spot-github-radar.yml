name: Spot GitHub Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: spot-github-radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Load latest adaptive QUBO V5 model
        id: qubomodel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          rm -rf .qubo-adaptive
          mkdir -p .qubo-adaptive
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow spot-qubo-adaptive-learning.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null)
          if [ -z "$RUN_ID" ]; then
            echo 'status=STATIC_BASE' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name spot-qubo-adaptive-v5 --dir .qubo-adaptive >/dev/null 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ] || [ ! -f .qubo-adaptive/spot-qubo-adaptive-v5.json ]; then
            echo 'status=STATIC_BASE' >> "$GITHUB_OUTPUT"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'status=ADAPTIVE_LOADED' >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "model_version=$(jq -r '.model_version' .qubo-adaptive/spot-qubo-adaptive-v5.json)" >> "$GITHUB_OUTPUT"
          echo "adaptive_state=$(jq -r '.adaptive_state' .qubo-adaptive/spot-qubo-adaptive-v5.json)" >> "$GITHUB_OUTPUT"

      - name: Run production Spot QUBO radar with V4.2 + active Spot filter
        id: scan
        env:
          QUBO_V5_ADAPTIVE_CONFIG: ${{ github.workspace }}/.qubo-adaptive/spot-qubo-adaptive-v5.json
        shell: bash
        run: |
          set -euo pipefail
          RESULT=$(node backend/scripts/github-spot-production-radar-v42-active.js)
          printf '%s\n' "$RESULT"
          printf '%s\n' "$RESULT" > spot-radar-scan.json
          NOTIFY=$(printf '%s' "$RESULT" | jq -r '.notify // false')
          echo "notify=$NOTIFY" >> "$GITHUB_OUTPUT"
          if [ "$NOTIFY" != "true" ]; then
            echo 'symbol=none' >> "$GITHUB_OUTPUT"
            echo "reason=$(printf '%s' "$RESULT" | jq -r '.reason // "no signal"')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "symbol=$(printf '%s' "$RESULT" | jq -r '.symbol')" >> "$GITHUB_OUTPUT"
          echo "pct=$(printf '%s' "$RESULT" | jq -r '.pct')" >> "$GITHUB_OUTPUT"
          echo "price=$(printf '%s' "$RESULT" | jq -r '.price')" >> "$GITHUB_OUTPUT"
          echo "quote_volume=$(printf '%s' "$RESULT" | jq -r '.quote_volume')" >> "$GITHUB_OUTPUT"
          echo "source=$(printf '%s' "$RESULT" | jq -r '.source')" >> "$GITHUB_OUTPUT"
          echo "utility=$(printf '%s' "$RESULT" | jq -r '.utility')" >> "$GITHUB_OUTPUT"
          echo "qubo_method=$(printf '%s' "$RESULT" | jq -r '.qubo_method')" >> "$GITHUB_OUTPUT"
          echo "qubo_objective=$(printf '%s' "$RESULT" | jq -r '.qubo_objective')" >> "$GITHUB_OUTPUT"
          echo "qubo_selected=$(printf '%s' "$RESULT" | jq -r '.qubo_selected_symbols | join(",")')" >> "$GITHUB_OUTPUT"
          echo "qubo_model_version=$(printf '%s' "$RESULT" | jq -r '.qubo_model_version // "unknown"')" >> "$GITHUB_OUTPUT"
          echo "qubo_hardware_ready=$(printf '%s' "$RESULT" | jq -r '.qubo_hardware_ready // false')" >> "$GITHUB_OUTPUT"
          echo "qubo_solver=$(printf '%s' "$RESULT" | jq -r '.qubo_solver // "unknown"')" >> "$GITHUB_OUTPUT"
          echo "qubo_binary_variables=$(printf '%s' "$RESULT" | jq -r '.qubo_model_stats.total_binary_variables // 0')" >> "$GITHUB_OUTPUT"
          echo "qubo_adaptive=$(printf '%s' "$RESULT" | jq -r '.qubo_adaptive // false')" >> "$GITHUB_OUTPUT"
          echo "qubo_adaptive_state=$(printf '%s' "$RESULT" | jq -r '.qubo_adaptive_state // "STATIC_BASE"')" >> "$GITHUB_OUTPUT"
          echo "qubo_weights=$(printf '%s' "$RESULT" | jq -c '.qubo_weights // {}')" >> "$GITHUB_OUTPUT"
          echo "qubo_effective_weights=$(printf '%s' "$RESULT" | jq -c '.qubo_effective_weights // .qubo_weights // {}')" >> "$GITHUB_OUTPUT"
          echo "market_regime=$(printf '%s' "$RESULT" | jq -r '.market_regime // "UNKNOWN"')" >> "$GITHUB_OUTPUT"
          echo "base_utility=$(printf '%s' "$RESULT" | jq -r '.base_utility // 0')" >> "$GITHUB_OUTPUT"
          echo "stable_norm=$(printf '%s' "$RESULT" | jq -r '.stable_norm // 0')" >> "$GITHUB_OUTPUT"
          echo "v42_pass_windows=$(printf '%s' "$RESULT" | jq -r '.v42_pass_windows')" >> "$GITHUB_OUTPUT"
          echo "v42_norm=$(printf '%s' "$RESULT" | jq -r '.v42_norm')" >> "$GITHUB_OUTPUT"
          echo "v42_ignition=$(printf '%s' "$RESULT" | jq -r '.v42_detail.ignition')" >> "$GITHUB_OUTPUT"
          echo "v42_confirm=$(printf '%s' "$RESULT" | jq -r '.v42_detail.confirm')" >> "$GITHUB_OUTPUT"
          echo "v42_extension=$(printf '%s' "$RESULT" | jq -r '.v42_detail.extension')" >> "$GITHUB_OUTPUT"

      - name: Load previous V21 shadow state
        id: v21prev
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          rm -rf .v21-shadow
          mkdir -p .v21-shadow/previous
          PREV_RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow spot-github-radar.yml --branch main --status success --limit 5 --json databaseId --jq '.[].databaseId' 2>/dev/null | while read RID; do
            gh run download "$RID" --repo "$GITHUB_REPOSITORY" --name spot-v21-shadow-state --dir .v21-shadow/previous >/dev/null 2>&1 && { echo "$RID"; break; }
          done)
          if [ -f .v21-shadow/previous/spot-v21-shadow-state.json ]; then
            echo "state=.v21-shadow/previous/spot-v21-shadow-state.json" >> "$GITHUB_OUTPUT"
            echo "status=LOADED" >> "$GITHUB_OUTPUT"
            echo "run_id=$PREV_RUN" >> "$GITHUB_OUTPUT"
          else
            echo "state=" >> "$GITHUB_OUTPUT"
            echo "status=FRESH" >> "$GITHUB_OUTPUT"
          fi

      - name: Run V21 GitHub-native shadow
        id: v21shadow
        shell: bash
        run: |
          set -euo pipefail
          PREV="${{ steps.v21prev.outputs.state }}"
          if [ -n "$PREV" ]; then
            RESULT=$(node backend/scripts/github-spot-v21-shadow.js spot-radar-scan.json "$PREV" spot-v21-shadow-state.json spot-v21-shadow-evidence.json)
          else
            RESULT=$(node backend/scripts/github-spot-v21-shadow.js spot-radar-scan.json "" spot-v21-shadow-state.json spot-v21-shadow-evidence.json)
          fi
          printf '%s\n' "$RESULT"
          echo "pending=$(printf '%s' "$RESULT" | jq -r '.pending // 0')" >> "$GITHUB_OUTPUT"
          echo "open_positions=$(printf '%s' "$RESULT" | jq -r '.open_positions // 0')" >> "$GITHUB_OUTPUT"
          echo "results=$(printf '%s' "$RESULT" | jq -r '.total_results // 0')" >> "$GITHUB_OUTPUT"
          echo "win_rate=$(printf '%s' "$RESULT" | jq -r '.recent_30d_win_rate // 0')" >> "$GITHUB_OUTPUT"
          echo "avg_net=$(printf '%s' "$RESULT" | jq -r '.recent_30d_avg_net_return // 0')" >> "$GITHUB_OUTPUT"
          echo "arm=$(printf '%s' "$RESULT" | jq -r '.decision.arm // "none"')" >> "$GITHUB_OUTPUT"
          echo "status=$(printf '%s' "$RESULT" | jq -r '.decision.status // "none"')" >> "$GITHUB_OUTPUT"
          echo "context=$(printf '%s' "$RESULT" | jq -r '.decision.context // "none"')" >> "$GITHUB_OUTPUT"

      - name: Upload V21 shadow state
        uses: actions/upload-artifact@v4
        with:
          name: spot-v21-shadow-state
          path: spot-v21-shadow-state.json
          retention-days: 30
          overwrite: true

      - name: Upload V21 shadow evidence
        uses: actions/upload-artifact@v4
        with:
          name: spot-v21-shadow-evidence-${{ github.run_id }}
          path: spot-v21-shadow-evidence.json
          retention-days: 30

      - name: Build bounded pre-approval rejection ledger
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .radar-learning/previous
          PREV_RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow spot-github-radar.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
          PREV_FILE=""
          if [ -n "$PREV_RUN" ]; then
            gh run download "$PREV_RUN" --repo "$GITHUB_REPOSITORY" --name spot-radar-rejection-ledger --dir .radar-learning/previous >/dev/null 2>&1 || true
            if [ -f .radar-learning/previous/spot-radar-rejection-ledger.json ]; then
              PREV_FILE=.radar-learning/previous/spot-radar-rejection-ledger.json
            fi
          fi
          node backend/scripts/update-spot-radar-rejection-ledger.js spot-radar-scan.json "$PREV_FILE" spot-radar-rejection-ledger.json

      - name: Upload bounded pre-approval rejection ledger
        uses: actions/upload-artifact@v4
        with:
          name: spot-radar-rejection-ledger
          path: spot-radar-rejection-ledger.json
          retention-days: 14

      - name: Load latest independent V8 hunter shadow model
        id: v8model
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          rm -rf .v8-model
          mkdir -p .v8-model
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow spot-v8-hunter-shadow-model.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null)
          if [ -z "$RUN_ID" ]; then
            echo 'status=UNAVAILABLE' >> "$GITHUB_OUTPUT"
            echo 'No successful V8 hunter shadow model run yet; V4.2 continues unaffected.'
            exit 0
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name spot-v8-hunter-shadow-model --dir .v8-model >/dev/null 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ] || [ ! -f .v8-model/spot-v8-hunter-shadow-model.json ]; then
            echo 'status=UNAVAILABLE' >> "$GITHUB_OUTPUT"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo 'V8 hunter model download unavailable; V4.2 continues unaffected.'
            exit 0
          fi
          echo 'status=OK' >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "generated_at=$(jq -r '.generatedAt' .v8-model/spot-v8-hunter-shadow-model.json)" >> "$GITHUB_OUTPUT"
          echo "threshold=$(jq -r '.threshold' .v8-model/spot-v8-hunter-shadow-model.json)" >> "$GITHUB_OUTPUT"

      - name: Run independent V8 HUNTER shadow over market
        if: steps.v8model.outputs.status == 'OK'
        id: v8hunter
        env:
          V42_NOTIFY: ${{ steps.scan.outputs.notify || 'false' }}
          V42_SYMBOL: ${{ steps.scan.outputs.symbol || 'none' }}
        shell: bash
        run: |
          set +e
          RESULT=$(node backend/scripts/github-spot-v8-hunter-shadow.js .v8-model/spot-v8-hunter-shadow-model.json v8-hunter-shadow-evidence.json 2>v8-hunter-shadow.err)
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            cat v8-hunter-shadow.err >&2 || true
            echo 'status=UNAVAILABLE' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            echo 'symbols=none' >> "$GITHUB_OUTPUT"
            echo 'overlap_v42=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$RESULT"
          echo 'status=OK' >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s' "$RESULT" | jq -r '.signalCount')" >> "$GITHUB_OUTPUT"
          echo "symbols=$(printf '%s' "$RESULT" | jq -r '[.signals[].symbol] | if length==0 then "none" else join(",") end')" >> "$GITHUB_OUTPUT"
          echo "cohorts=$(printf '%s' "$RESULT" | jq -r '[.signals[].cohort] | if length==0 then "none" else join(",") end')" >> "$GITHUB_OUTPUT"
          echo "overlap_v42=$(printf '%s' "$RESULT" | jq -r '[.signals[] | select(.cohort=="BOTH")] | length > 0')" >> "$GITHUB_OUTPUT"
          echo "eligible=$(printf '%s' "$RESULT" | jq -r '.eligibleInstant')" >> "$GITHUB_OUTPUT"
          echo "active_universe=$(printf '%s' "$RESULT" | jq -r '.universe.activeSpotUsdt')" >> "$GITHUB_OUTPUT"
          echo "detailed_loaded=$(printf '%s' "$RESULT" | jq -r '.universe.detailedLoaded')" >> "$GITHUB_OUTPUT"

      - name: Upload independent V8 hunter evidence
        if: steps.v8hunter.outputs.status == 'OK' && steps.v8hunter.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: v8-hunter-shadow-evidence-${{ github.run_id }}
          path: v8-hunter-shadow-evidence.json
          retention-days: 30

      - name: Avoid duplicate signal issue
        if: steps.scan.outputs.notify == 'true'
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          SYMBOL: ${{ steps.scan.outputs.symbol }}
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "[SPOT SIGNAL] $SYMBOL in:title" --limit 20 --json number,createdAt --jq '[.[] | select((.createdAt | fromdateiso8601) >= (now - 1200))] | length')
          if [ "$COUNT" -gt 0 ]; then
            echo 'duplicate=true' >> "$GITHUB_OUTPUT"
          else
            echo 'duplicate=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create autonomous production Spot signal
        if: steps.scan.outputs.notify == 'true' && steps.dedupe.outputs.duplicate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYMBOL: ${{ steps.scan.outputs.symbol }}
          PCT: ${{ steps.scan.outputs.pct }}
          PRICE: ${{ steps.scan.outputs.price }}
          QV: ${{ steps.scan.outputs.quote_volume }}
          SOURCE: ${{ steps.scan.outputs.source }}
          UTILITY: ${{ steps.scan.outputs.utility }}
          QUBO_METHOD: ${{ steps.scan.outputs.qubo_method }}
          QUBO_OBJECTIVE: ${{ steps.scan.outputs.qubo_objective }}
          QUBO_SELECTED: ${{ steps.scan.outputs.qubo_selected }}
          QUBO_MODEL_VERSION: ${{ steps.scan.outputs.qubo_model_version }}
          QUBO_HARDWARE_READY: ${{ steps.scan.outputs.qubo_hardware_ready }}
          QUBO_SOLVER: ${{ steps.scan.outputs.qubo_solver }}
          QUBO_BINARY_VARIABLES: ${{ steps.scan.outputs.qubo_binary_variables }}
          QUBO_ADAPTIVE: ${{ steps.scan.outputs.qubo_adaptive }}
          QUBO_ADAPTIVE_STATE: ${{ steps.scan.outputs.qubo_adaptive_state }}
          QUBO_WEIGHTS: ${{ steps.scan.outputs.qubo_weights }}
          QUBO_EFFECTIVE_WEIGHTS: ${{ steps.scan.outputs.qubo_effective_weights }}
          MARKET_REGIME: ${{ steps.scan.outputs.market_regime }}
          BASE_UTILITY: ${{ steps.scan.outputs.base_utility }}
          STABLE_NORM: ${{ steps.scan.outputs.stable_norm }}
          V42_PASS: ${{ steps.scan.outputs.v42_pass_windows }}
          V42_NORM: ${{ steps.scan.outputs.v42_norm }}
          V42_IGNITION: ${{ steps.scan.outputs.v42_ignition }}
          V42_CONFIRM: ${{ steps.scan.outputs.v42_confirm }}
          V42_EXTENSION: ${{ steps.scan.outputs.v42_extension }}
          V8_STATUS: ${{ steps.v8hunter.outputs.status || 'UNAVAILABLE' }}
          V8_SYMBOLS: ${{ steps.v8hunter.outputs.symbols || 'none' }}
          V8_OVERLAP: ${{ steps.v8hunter.outputs.overlap_v42 || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="[SPOT SIGNAL] $SYMBOL +${PCT}%"
          BODY=$(printf '%s\n\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n\n%s' \
            'Proypers25 detectó una oportunidad Spot en producción con V4.2 y QUBO V5 hardware-ready.' \
            "- Símbolo: $SYMBOL" \
            "- Cambio 24h: +${PCT}%" \
            "- Precio: $PRICE" \
            "- Volumen quote 24h: $QV USD/USDT aprox." \
            "- Fuente: $SOURCE" \
            "- Utility: $UTILITY" \
            "- QUBO: $QUBO_METHOD" \
            "- Objetivo QUBO: $QUBO_OBJECTIVE" \
            "- Selección QUBO: $QUBO_SELECTED" \
            "- QUBO V5: modelo=$QUBO_MODEL_VERSION | solver=$QUBO_SOLVER | hardware_ready=$QUBO_HARDWARE_READY | variables_binarias=$QUBO_BINARY_VARIABLES" \
            "- QUBO aprendizaje: adaptive=$QUBO_ADAPTIVE | estado=$QUBO_ADAPTIVE_STATE | weights=$QUBO_WEIGHTS" \
            "- QUBO contexto: regime=$MARKET_REGIME | effective_weights=$QUBO_EFFECTIVE_WEIGHTS" \
            "- QUBO features: base=$BASE_UTILITY | stable=$STABLE_NORM | v42=$V42_NORM" \
            "- V4.2 robustez: $V42_PASS/3 ventanas | score: $V42_NORM" \
            "- V4.2 ignition: $V42_IGNITION | confirm: $V42_CONFIRM | extension: $V42_EXTENSION" \
            "- V8 HUNTER shadow independiente: estado=$V8_STATUS | candidatos=$V8_SYMBOLS | coincide con V4.2=$V8_OVERLAP" \
            'V8 HUNTER es solo evidencia independiente: no habilita, bloquea, prioriza ni modifica la orden. Acción real: validación y ejecución autónoma V4.2/QUBO en el runner local.')
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"

      - name: Dispatch autonomous local validator
        if: steps.scan.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run spot-manual-approval.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo 'Autonomous validator dispatched through workflow_dispatch.'

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### Spot GitHub Radar — Production V4.2 + QUBO V5 hardware-ready / independent V8 HUNTER shadow' >> "$GITHUB_STEP_SUMMARY"
          echo '- GCP usado: no' >> "$GITHUB_STEP_SUMMARY"
          echo '- Universo productivo: solo símbolos Binance Spot USDT activos (TRADING)' >> "$GITHUB_STEP_SUMMARY"
          echo '- V4.2: gate de admisión se mantiene intacto' >> "$GITHUB_STEP_SUMMARY"
          echo "- Ranking productivo QUBO V5: weights=${{ steps.scan.outputs.qubo_effective_weights || steps.scan.outputs.qubo_weights || '{}' }} | regime=${{ steps.scan.outputs.market_regime || 'UNKNOWN' }} | adaptive=${{ steps.scan.outputs.qubo_adaptive || 'false' }} | estado=${{ steps.scan.outputs.qubo_adaptive_state || 'STATIC_BASE' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- ENTRY-first: retirado de producción tras fallar holdouts frescos R5' >> "$GITHUB_STEP_SUMMARY"
          echo '- QUBO V5: BQM binario normalizado, restricción de cardinalidad codificada con slack bits, correlación como término cuadrático; selección final en producción' >> "$GITHUB_STEP_SUMMARY"
          echo "- QUBO solver actual: ${{ steps.scan.outputs.qubo_solver || 'n/a' }} | hardware-ready=${{ steps.scan.outputs.qubo_hardware_ready || 'false' }} | variables=${{ steps.scan.outputs.qubo_binary_variables || '0' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- QUBO learner artifact: ${{ steps.qubomodel.outputs.status || 'STATIC_BASE' }} | run=${{ steps.qubomodel.outputs.run_id || 'n/a' }} | model=${{ steps.qubomodel.outputs.model_version || 'base' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- V8 HUNTER: scanner independiente cada 5m; peso de ejecución = 0; no bloquea ni habilita órdenes' >> "$GITHUB_STEP_SUMMARY"
          echo '- V21 SHADOW: router causal GitHub-native; peso de ejecución = 0; estado persistente por artifact; sin GCP/Firestore/Binance keys' >> "$GITHUB_STEP_SUMMARY"
          echo "- V21 state: prev=${{ steps.v21prev.outputs.status || 'FRESH' }} | pendientes=${{ steps.v21shadow.outputs.pending || '0' }} | abiertas=${{ steps.v21shadow.outputs.open_positions || '0' }} | resultados=${{ steps.v21shadow.outputs.results || '0' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- V21 último: arm=${{ steps.v21shadow.outputs.arm || 'none' }} | status=${{ steps.v21shadow.outputs.status || 'none' }} | context=${{ steps.v21shadow.outputs.context || 'none' }} | win30d=${{ steps.v21shadow.outputs.win_rate || '0' }} | avgNet30d=${{ steps.v21shadow.outputs.avg_net || '0' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- V8 HUNTER model: entrenamiento diario separado para evitar reentrenar 7 días en cada scan' >> "$GITHUB_STEP_SUMMARY"
          echo '- Evidencia V8: artifacts solo cuando existen candidatos; cohortes V8_ONLY o BOTH' >> "$GITHUB_STEP_SUMMARY"
          echo '- V4.2: VOLUME_IGNITION → FRESH_RS_CONFIRM → RELATIVE_STRENGTH_EXTENSION' >> "$GITHUB_STEP_SUMMARY"
          echo '- Gate V4.2: mínimo 2/3 ventanas entrenadas' >> "$GITHUB_STEP_SUMMARY"
          echo '- Validador local: dispatch automático únicamente por señal productiva V4.2/QUBO' >> "$GITHUB_STEP_SUMMARY"
          echo '- Aprendizaje contrafactual: rechazos pre-aprobación se conservan en ledger acotado; nunca disparan órdenes' >> "$GITHUB_STEP_SUMMARY"
          echo "- Fuente V4.2: ${{ steps.scan.outputs.source || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Notificación V4.2: ${{ steps.scan.outputs.notify || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Símbolo V4.2: ${{ steps.scan.outputs.symbol || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- V8 model: ${{ steps.v8model.outputs.status || 'UNAVAILABLE' }} | run=${{ steps.v8model.outputs.run_id || 'n/a' }} | th=${{ steps.v8model.outputs.threshold || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- V8 HUNTER: ${{ steps.v8hunter.outputs.status || 'UNAVAILABLE' }} | señales=${{ steps.v8hunter.outputs.count || '0' }} | símbolos=${{ steps.v8hunter.outputs.symbols || 'none' }} | cohortes=${{ steps.v8hunter.outputs.cohorts || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- V8 universo detallado: ${{ steps.v8hunter.outputs.detailed_loaded || 'n/a' }} / activos=${{ steps.v8hunter.outputs.active_universe || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Motivo sin señal V4.2: ${{ steps.scan.outputs.reason || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"

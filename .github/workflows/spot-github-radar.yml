name: Spot GitHub Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: spot-github-radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run production Spot QUBO radar with V4.2 + active Spot filter
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          RESULT=$(node backend/scripts/github-spot-production-radar-v42-active.js)
          printf '%s\n' "$RESULT"
          NOTIFY=$(printf '%s' "$RESULT" | jq -r '.notify // false')
          echo "notify=$NOTIFY" >> "$GITHUB_OUTPUT"
          if [ "$NOTIFY" != "true" ]; then
            echo 'symbol=none' >> "$GITHUB_OUTPUT"
            echo "reason=$(printf '%s' "$RESULT" | jq -r '.reason // "no signal"')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "symbol=$(printf '%s' "$RESULT" | jq -r '.symbol')" >> "$GITHUB_OUTPUT"
          echo "pct=$(printf '%s' "$RESULT" | jq -r '.pct')" >> "$GITHUB_OUTPUT"
          echo "price=$(printf '%s' "$RESULT" | jq -r '.price')" >> "$GITHUB_OUTPUT"
          echo "quote_volume=$(printf '%s' "$RESULT" | jq -r '.quote_volume')" >> "$GITHUB_OUTPUT"
          echo "source=$(printf '%s' "$RESULT" | jq -r '.source')" >> "$GITHUB_OUTPUT"
          echo "utility=$(printf '%s' "$RESULT" | jq -r '.utility')" >> "$GITHUB_OUTPUT"
          echo "qubo_method=$(printf '%s' "$RESULT" | jq -r '.qubo_method')" >> "$GITHUB_OUTPUT"
          echo "qubo_objective=$(printf '%s' "$RESULT" | jq -r '.qubo_objective')" >> "$GITHUB_OUTPUT"
          echo "qubo_selected=$(printf '%s' "$RESULT" | jq -r '.qubo_selected_symbols | join(",")')" >> "$GITHUB_OUTPUT"
          echo "v42_pass_windows=$(printf '%s' "$RESULT" | jq -r '.v42_pass_windows')" >> "$GITHUB_OUTPUT"
          echo "v42_norm=$(printf '%s' "$RESULT" | jq -r '.v42_norm')" >> "$GITHUB_OUTPUT"
          echo "v42_ignition=$(printf '%s' "$RESULT" | jq -r '.v42_detail.ignition')" >> "$GITHUB_OUTPUT"
          echo "v42_confirm=$(printf '%s' "$RESULT" | jq -r '.v42_detail.confirm')" >> "$GITHUB_OUTPUT"
          echo "v42_extension=$(printf '%s' "$RESULT" | jq -r '.v42_detail.extension')" >> "$GITHUB_OUTPUT"

      - name: Load latest independent V8 hunter shadow model
        id: v8model
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          rm -rf .v8-model
          mkdir -p .v8-model
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow spot-v8-hunter-shadow-model.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null)
          if [ -z "$RUN_ID" ]; then
            echo 'status=UNAVAILABLE' >> "$GITHUB_OUTPUT"
            echo 'No successful V8 hunter shadow model run yet; V4.2 continues unaffected.'
            exit 0
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name spot-v8-hunter-shadow-model --dir .v8-model >/dev/null 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ] || [ ! -f .v8-model/spot-v8-hunter-shadow-model.json ]; then
            echo 'status=UNAVAILABLE' >> "$GITHUB_OUTPUT"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo 'V8 hunter model download unavailable; V4.2 continues unaffected.'
            exit 0
          fi
          echo 'status=OK' >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "generated_at=$(jq -r '.generatedAt' .v8-model/spot-v8-hunter-shadow-model.json)" >> "$GITHUB_OUTPUT"
          echo "threshold=$(jq -r '.threshold' .v8-model/spot-v8-hunter-shadow-model.json)" >> "$GITHUB_OUTPUT"

      - name: Run independent V8 HUNTER shadow over market
        if: steps.v8model.outputs.status == 'OK'
        id: v8hunter
        env:
          V42_NOTIFY: ${{ steps.scan.outputs.notify || 'false' }}
          V42_SYMBOL: ${{ steps.scan.outputs.symbol || 'none' }}
        shell: bash
        run: |
          set +e
          RESULT=$(node backend/scripts/github-spot-v8-hunter-shadow.js .v8-model/spot-v8-hunter-shadow-model.json v8-hunter-shadow-evidence.json 2>v8-hunter-shadow.err)
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            cat v8-hunter-shadow.err >&2 || true
            echo 'status=UNAVAILABLE' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            echo 'symbols=none' >> "$GITHUB_OUTPUT"
            echo 'overlap_v42=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$RESULT"
          echo 'status=OK' >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s' "$RESULT" | jq -r '.signalCount')" >> "$GITHUB_OUTPUT"
          echo "symbols=$(printf '%s' "$RESULT" | jq -r '[.signals[].symbol] | if length==0 then "none" else join(",") end')" >> "$GITHUB_OUTPUT"
          echo "cohorts=$(printf '%s' "$RESULT" | jq -r '[.signals[].cohort] | if length==0 then "none" else join(",") end')" >> "$GITHUB_OUTPUT"
          echo "overlap_v42=$(printf '%s' "$RESULT" | jq -r '[.signals[] | select(.cohort=="BOTH")] | length > 0')" >> "$GITHUB_OUTPUT"
          echo "eligible=$(printf '%s' "$RESULT" | jq -r '.eligibleInstant')" >> "$GITHUB_OUTPUT"
          echo "active_universe=$(printf '%s' "$RESULT" | jq -r '.universe.activeSpotUsdt')" >> "$GITHUB_OUTPUT"
          echo "detailed_loaded=$(printf '%s' "$RESULT" | jq -r '.universe.detailedLoaded')" >> "$GITHUB_OUTPUT"

      - name: Upload independent V8 hunter evidence
        if: steps.v8hunter.outputs.status == 'OK' && steps.v8hunter.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: v8-hunter-shadow-evidence-${{ github.run_id }}
          path: v8-hunter-shadow-evidence.json
          retention-days: 30

      - name: Avoid duplicate signal issue
        if: steps.scan.outputs.notify == 'true'
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          SYMBOL: ${{ steps.scan.outputs.symbol }}
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "[SPOT SIGNAL] $SYMBOL in:title" --limit 20 --json number,createdAt --jq '[.[] | select((.createdAt | fromdateiso8601) >= (now - 1200))] | length')
          if [ "$COUNT" -gt 0 ]; then
            echo 'duplicate=true' >> "$GITHUB_OUTPUT"
          else
            echo 'duplicate=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create autonomous production Spot signal
        if: steps.scan.outputs.notify == 'true' && steps.dedupe.outputs.duplicate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYMBOL: ${{ steps.scan.outputs.symbol }}
          PCT: ${{ steps.scan.outputs.pct }}
          PRICE: ${{ steps.scan.outputs.price }}
          QV: ${{ steps.scan.outputs.quote_volume }}
          SOURCE: ${{ steps.scan.outputs.source }}
          UTILITY: ${{ steps.scan.outputs.utility }}
          QUBO_METHOD: ${{ steps.scan.outputs.qubo_method }}
          QUBO_OBJECTIVE: ${{ steps.scan.outputs.qubo_objective }}
          QUBO_SELECTED: ${{ steps.scan.outputs.qubo_selected }}
          V42_PASS: ${{ steps.scan.outputs.v42_pass_windows }}
          V42_NORM: ${{ steps.scan.outputs.v42_norm }}
          V42_IGNITION: ${{ steps.scan.outputs.v42_ignition }}
          V42_CONFIRM: ${{ steps.scan.outputs.v42_confirm }}
          V42_EXTENSION: ${{ steps.scan.outputs.v42_extension }}
          V8_STATUS: ${{ steps.v8hunter.outputs.status || 'UNAVAILABLE' }}
          V8_SYMBOLS: ${{ steps.v8hunter.outputs.symbols || 'none' }}
          V8_OVERLAP: ${{ steps.v8hunter.outputs.overlap_v42 || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="[SPOT SIGNAL] $SYMBOL +${PCT}%"
          BODY=$(printf '%s\n\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n\n%s' \
            'Proypers25 detectó una oportunidad Spot en producción con V4.2 y QUBO.' \
            "- Símbolo: $SYMBOL" \
            "- Cambio 24h: +${PCT}%" \
            "- Precio: $PRICE" \
            "- Volumen quote 24h: $QV USD/USDT aprox." \
            "- Fuente: $SOURCE" \
            "- Utility: $UTILITY" \
            "- QUBO: $QUBO_METHOD" \
            "- Objetivo QUBO: $QUBO_OBJECTIVE" \
            "- Selección QUBO: $QUBO_SELECTED" \
            "- V4.2 robustez: $V42_PASS/3 ventanas | score: $V42_NORM" \
            "- V4.2 ignition: $V42_IGNITION | confirm: $V42_CONFIRM | extension: $V42_EXTENSION" \
            "- V8 HUNTER shadow independiente: estado=$V8_STATUS | candidatos=$V8_SYMBOLS | coincide con V4.2=$V8_OVERLAP" \
            'V8 HUNTER es solo evidencia independiente: no habilita, bloquea, prioriza ni modifica la orden. Acción real: validación y ejecución autónoma V4.2/QUBO en el runner local.')
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --assignee Famarquezh1

      - name: Dispatch autonomous local validator
        if: steps.scan.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run spot-manual-approval.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo 'Autonomous validator dispatched through workflow_dispatch.'

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### Spot GitHub Radar — Production V4.2 + QUBO / independent V8 HUNTER shadow' >> "$GITHUB_STEP_SUMMARY"
          echo '- GCP usado: no' >> "$GITHUB_STEP_SUMMARY"
          echo '- Universo productivo: solo símbolos Binance Spot USDT activos (TRADING)' >> "$GITHUB_STEP_SUMMARY"
          echo '- V4.2: gate de admisión se mantiene intacto' >> "$GITHUB_STEP_SUMMARY"
          echo '- Ranking productivo: base 40% + stable 15% + V4.2 45%' >> "$GITHUB_STEP_SUMMARY"
          echo '- ENTRY-first: retirado de producción tras fallar holdouts frescos R5' >> "$GITHUB_STEP_SUMMARY"
          echo '- QUBO: selección final en producción' >> "$GITHUB_STEP_SUMMARY"
          echo '- V8 HUNTER: scanner independiente cada 5m; peso de ejecución = 0; no bloquea ni habilita órdenes' >> "$GITHUB_STEP_SUMMARY"
          echo '- V8 HUNTER model: entrenamiento diario separado para evitar reentrenar 7 días en cada scan' >> "$GITHUB_STEP_SUMMARY"
          echo '- Evidencia V8: artifacts solo cuando existen candidatos; cohortes V8_ONLY o BOTH' >> "$GITHUB_STEP_SUMMARY"
          echo '- V4.2: VOLUME_IGNITION → FRESH_RS_CONFIRM → RELATIVE_STRENGTH_EXTENSION' >> "$GITHUB_STEP_SUMMARY"
          echo '- Gate V4.2: mínimo 2/3 ventanas entrenadas' >> "$GITHUB_STEP_SUMMARY"
          echo '- Validador local: dispatch automático únicamente por señal productiva V4.2/QUBO' >> "$GITHUB_STEP_SUMMARY"
          echo "- Fuente V4.2: ${{ steps.scan.outputs.source || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Notificación V4.2: ${{ steps.scan.outputs.notify || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Símbolo V4.2: ${{ steps.scan.outputs.symbol || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- V8 model: ${{ steps.v8model.outputs.status || 'UNAVAILABLE' }} | run=${{ steps.v8model.outputs.run_id || 'n/a' }} | th=${{ steps.v8model.outputs.threshold || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- V8 HUNTER: ${{ steps.v8hunter.outputs.status || 'UNAVAILABLE' }} | señales=${{ steps.v8hunter.outputs.count || '0' }} | símbolos=${{ steps.v8hunter.outputs.symbols || 'none' }} | cohortes=${{ steps.v8hunter.outputs.cohorts || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- V8 universo detallado: ${{ steps.v8hunter.outputs.detailed_loaded || 'n/a' }} / activos=${{ steps.v8hunter.outputs.active_universe || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Motivo sin señal V4.2: ${{ steps.scan.outputs.reason || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"

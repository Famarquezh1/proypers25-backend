name: Hetzner Binance read-only verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hetzner-bootstrap-check
  cancel-in-progress: false
jobs:
  private-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Install dedicated VPS credentials securely and run GET-only probe
        env:
          BOOTSTRAP_SSH_KEY: ${{ secrets.HETZNER_BOOTSTRAP_SSH_KEY }}
          BINANCE_API_KEY: ${{ secrets.HETZNER_BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.HETZNER_BINANCE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOOTSTRAP_SSH_KEY"
          test -n "$BINANCE_API_KEY"
          test -n "$BINANCE_SECRET_KEY"
          python3 - <<'PY'
          import os,json
          key=os.environ["BINANCE_API_KEY"]
          secret=os.environ["BINANCE_SECRET_KEY"]
          print(json.dumps({"credentialFormat":{"keyHasWhitespace":any(c.isspace() for c in key),"secretHasWhitespace":any(c.isspace() for c in secret),"keyAsciiAlphanumeric":key.isascii() and key.isalnum(),"secretAsciiAlphanumeric":secret.isascii() and secret.isalnum(),"keyEqualsSecret":key==secret},"tradingActivated":False}))
          PY
          umask 077
          WORKDIR=$(mktemp -d)
          trap 'rm -rf "$WORKDIR"' EXIT
          printf '%s\n' "$BOOTSTRAP_SSH_KEY" > "$WORKDIR/key"
          unset BOOTSTRAP_SSH_KEY
          SSH=(ssh -i "$WORKDIR/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$WORKDIR/known_hosts" -o ConnectTimeout=15 deploy@89.167.5.87)
          python3 -c 'import json,os; print(json.dumps({"binance-key":os.environ["BINANCE_API_KEY"],"binance-secret":os.environ["BINANCE_SECRET_KEY"]}))' | "${SSH[@]}" 'sudo python3 -c '\''import json,os,sys,tempfile
          data=json.load(sys.stdin)
          assert set(data)=={"binance-key","binance-secret"}
          assert all(isinstance(v,str) and len(v.strip())>=32 and "\n" not in v.strip() for v in data.values())
          base="/etc/proypers25"
          os.makedirs(base,mode=0o700,exist_ok=True)
          os.chmod(base,0o700)
          assert os.path.exists(base+"/TRADING_DISABLED")
          for name,value in data.items():
              fd,tmp=tempfile.mkstemp(prefix=".credential-",dir=base)
              with os.fdopen(fd,"w") as out:
                  out.write(value.strip())
                  out.flush()
                  os.fsync(out.fileno())
              os.replace(tmp,base+"/"+name)
          print("CREDENTIALS_INSTALLED trading_disabled=true")'\'''
          unset BINANCE_API_KEY BINANCE_SECRET_KEY
          "${SSH[@]}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo test -f /etc/proypers25/TRADING_DISABLED
          sudo tee /opt/proypers25/ipv4-preflight.cjs >/dev/null <<'JS'
          'use strict';
          const https = require('node:https');
          global.fetch = async (url, options = {}) => new Promise((resolve, reject) => {
            const target = new URL(url);
            if (target.origin !== 'https://api.binance.com' || options.method !== 'GET') {
              return reject(new Error('ENDPOINT_NOT_ALLOWED'));
            }
            const request = https.get(target, {family: 4, headers: options.headers,
              signal: options.signal}, response => {
              console.log(JSON.stringify({transport:'IPV4',localAddress:response.socket.localAddress,
                peerFamily:response.socket.remoteFamily,tradingActivated:false}));
              const chunks = [];
              let size = 0;
              response.on('data', chunk => {
                size += chunk.length;
                if (size > 4194304) response.destroy(new Error('RESPONSE_TOO_LARGE'));
                else chunks.push(chunk);
              });
              response.on('error', reject);
              response.on('end', () => resolve({ok:response.statusCode >= 200 && response.statusCode < 300,
                status:response.statusCode, json:async () => JSON.parse(Buffer.concat(chunks).toString('utf8'))}));
            });
            request.on('error', reject);
          });
          require('/opt/proypers25/preflight.cjs').main().catch(() => {
            console.error('IPV4_READONLY_CHECK_FAILED');
            process.exitCode = 1;
          });
          JS
          sudo chmod 0644 /opt/proypers25/ipv4-preflight.cjs
          sudo node --check /opt/proypers25/ipv4-preflight.cjs
          sudo systemd-run --quiet --wait --pipe --collect --uid=spot -p NoNewPrivileges=yes -p ProtectSystem=strict -p ProtectHome=yes -p PrivateTmp=yes -p MemoryMax=256M -p RuntimeMaxSec=90 -p LoadCredential=binance-key:/etc/proypers25/binance-key -p LoadCredential=binance-secret:/etc/proypers25/binance-secret /usr/bin/node /opt/proypers25/ipv4-preflight.cjs
          printf '%s\n' 'IPV4_PRIVATE_PREFLIGHT_COMPLETED trading_disabled=true'
          REMOTE

name: Spot CORE TimesFM Prospective Shadow
on:
  workflow_dispatch:
    inputs:
      symbol:
        required: true
        type: string
      price:
        required: true
        type: string
      signal_created_at:
        required: true
        type: string
      signal_issue:
        required: false
        type: string
permissions:
  contents: read
jobs:
  forecast:
    # Dispatched directly by the production radar only for its CORE signal path.
    runs-on: [self-hosted, Windows, X64, research-only, research-light]
    timeout-minutes: 20
    env:
      SIGNAL_SYMBOL: ${{ inputs.symbol }}
      SIGNAL_PRICE: ${{ inputs.price }}
      SIGNAL_CREATED_AT: ${{ inputs.signal_created_at }}
      SIGNAL_ISSUE: ${{ inputs.signal_issue }}
    steps:
      - uses: actions/checkout@v4
      - name: Use TimesFM runtime
        shell: powershell
        run: |
          $py='C:\Users\Famarquezh1\AppData\Local\Programs\Python\Python313\python.exe'
          if (-not (Test-Path $py)) { throw 'Python 3.13 unavailable' }
          "PROYPERS_PY=$py" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $cache=Join-Path $env:RUNNER_TEMP 'timesfm-hf-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "HF_HOME=$cache" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Ensure TimesFM 2.5
        shell: powershell
        run: |
          & $env:PROYPERS_PY -m pip install --quiet "timesfm[torch]==2.0.2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Freeze prospective decision
        shell: powershell
        run: |
          & $env:PROYPERS_PY research/timesfm/prospective_shadow.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: core-timesfm-prospective-${{ inputs.symbol }}-${{ github.run_id }}
          path: core-timesfm-prospective.json
          retention-days: 30

name: Spot Instant Edge Training V8.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/github-spot-instant-decision-trainer-v8.js'
      - 'backend/scripts/github-spot-instant-edge-trainer-v8_1.js'
      - '.github/workflows/spot-instant-edge-training-v8_1.yml'

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V8_MAX_SYMBOLS: '40'
      V8_MIN_QV: '200000'
      V8_ROUNDTRIP_COST: '0.0025'
      V81_EVAL_DAYS: '7'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guard isolated V8.1 trainer
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/scripts/github-spot-instant-decision-trainer-v8.js
          node --check backend/scripts/github-spot-instant-edge-trainer-v8_1.js
          ! grep -Eq 'BINANCE_(API|SECRET)_KEY|firebase-admin|firestore|placeOrder|createOrder|withdraw' backend/scripts/github-spot-instant-edge-trainer-v8_1.js
          grep -q "strictCalibration:true" backend/scripts/github-spot-instant-edge-trainer-v8_1.js
          grep -q "m.avgNet>0.001" backend/scripts/github-spot-instant-edge-trainer-v8_1.js
      - name: Train expected realized net edge
        run: node backend/scripts/github-spot-instant-edge-trainer-v8_1.js
      - name: Upload V8.1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: spot-instant-edge-v8-1-${{ github.run_id }}
          path: spot-instant-edge-v8_1.json
          retention-days: 30
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### Spot Instant Edge Training V8.1' >> "$GITHUB_STEP_SUMMARY"
          echo '- Target: realized net return, not winner probability' >> "$GITHUB_STEP_SUMMARY"
          echo '- Rolling training: 7d; recent calibration: 2d; decision cadence: 5m' >> "$GITHUB_STEP_SUMMARY"
          echo '- Calibration must be economically positive or the day abstains' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production mutation: none' >> "$GITHUB_STEP_SUMMARY"
          if [ -f spot-instant-edge-v8_1.json ]; then
            jq -r '"- Verdict: \(.verdict)\n- Active days: \(.aggregate.activeDays)/\(.aggregate.evaluatedDays)\n- Abstain days: \(.aggregate.abstainDays)\n- Positive active days: \(.aggregate.positiveActiveDays)\n- Trades: \(.aggregate.totalTrades)\n- Avg daily growth: \(.aggregate.avgDailyGrowth)\n- Avg net/trade: \(.aggregate.avgNetPerTrade)\n- Latest model available: \(.latestModelAvailable)"' spot-instant-edge-v8_1.json >> "$GITHUB_STEP_SUMMARY"
          fi

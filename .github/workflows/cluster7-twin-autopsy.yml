name: Cluster7 Twin Autopsy
on:
  pull_request:
    paths: ['backend/scripts/github-cluster7-twin-autopsy.js','.github/workflows/cluster7-twin-autopsy.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check backend/scripts/github-cluster7-twin-autopsy.js
      - run: node backend/scripts/github-cluster7-twin-autopsy.js
      - uses: actions/upload-artifact@v4
        with: {name: cluster7-twin-autopsy, path: cluster7-twin-autopsy.json, retention-days: 30}

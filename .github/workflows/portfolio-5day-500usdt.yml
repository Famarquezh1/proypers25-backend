name: Portfolio 5Day 500USDT
on:
  pull_request:
    paths: ['backend/scripts/github-portfolio-5day-500usdt.js','.github/workflows/portfolio-5day-500usdt.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check backend/scripts/github-portfolio-5day-500usdt.js
      - run: node backend/scripts/github-portfolio-5day-500usdt.js
      - uses: actions/upload-artifact@v4
        with: {name: portfolio-5day-500usdt, path: portfolio-5day-500usdt.json, retention-days: 30}

name: Spot research scheduler

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        required: true
        default: all
        type: choice
        options:
          - discovery
          - quant
          - adaptive
          - promotion
          - governance
          - all
  schedule:
    - cron: '7 * * * *'
    - cron: '37 * * * *'

permissions:
  contents: read

concurrency:
  group: spot-research-consolidated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: proypers2025

      - name: Load current runtime config
        shell: bash
        run: |
          set -euo pipefail
          CRON_SECRET_VALUE=$(gcloud secrets versions access latest --secret=cron-secret --project=proypers2025)
          BACKEND_URL_VALUE=$(gcloud run services describe proypers25-backend --project=proypers2025 --region=southamerica-west1 --platform=managed --format='value(status.url)')
          test -n "$CRON_SECRET_VALUE"
          test -n "$BACKEND_URL_VALUE"
          echo "::add-mask::$CRON_SECRET_VALUE"
          echo "CRON_SECRET=$CRON_SECRET_VALUE" >> "$GITHUB_ENV"
          echo "BACKEND_URL=$BACKEND_URL_VALUE" >> "$GITHUB_ENV"

      - name: Run productive Spot research cycle
        env:
          MANUAL_TASK: ${{ inputs.task || 'scheduled' }}
          SCHEDULE_SLOT: ${{ github.event.schedule || '' }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          test -n "$BACKEND_URL"
          echo "event=$GITHUB_EVENT_NAME task=$MANUAL_TASK schedule_slot=${SCHEDULE_SLOT:-manual} backend=$BACKEND_URL policy=FULL_FREQUENCY"
          MARKET_RESULT='{}'

          call_endpoint() {
            local endpoint="$1"
            local body="$2"
            local max_time="${3:-300}"
            local label="${4:-$endpoint}"
            local response_file error_file heartbeat_pid started_at exit_code

            response_file=$(mktemp)
            error_file=$(mktemp)
            started_at=$(date +%s)

            (
              while true; do
                sleep 30
                now=$(date +%s)
                echo "HEARTBEAT label=$label elapsed_seconds=$((now-started_at))" >&2
              done
            ) &
            heartbeat_pid=$!

            set +e
            curl --silent --show-error --fail-with-body \
              --retry 3 --retry-all-errors --retry-delay 5 \
              --connect-timeout 20 --max-time "$max_time" \
              -X POST "$BACKEND_URL$endpoint" \
              -H "Content-Type: application/json" \
              -H "x-cron-secret: $CRON_SECRET" \
              --data "$body" >"$response_file" 2>"$error_file"
            exit_code=$?
            set -e

            kill "$heartbeat_pid" 2>/dev/null || true
            wait "$heartbeat_pid" 2>/dev/null || true

            if [ "$exit_code" -ne 0 ]; then
              echo "ENDPOINT_FAILED label=$label code=$exit_code endpoint=$endpoint" >&2
              cat "$error_file" >&2 || true
              rm -f "$response_file" "$error_file"
              return "$exit_code"
            fi

            cat "$response_file"
            rm -f "$response_file" "$error_file"
          }

          run_market_opportunity() {
            echo "MARKET_OPPORTUNITY_START bands=8_to_40 mode=observe_and_feed_quant"
            MARKET_RESULT=$(call_endpoint "/internal/cron/binance/spot-market-opportunity" '{"researchLimit":10}' 180 "market-opportunity")
            printf '%s\n' "$MARKET_RESULT" | jq '{ok,id,version,breadth,research_symbols,top_winners:(.top_winners[:10]),learning_mode,no_order_created}'
          }

          run_gem_radar() {
            echo "GEM_RADAR_START universe=dynamic max_research=10 quant=v6_productive"
            if RADAR_RESULT=$(call_endpoint "/internal/cron/binance/spot-new-assets-discovery" '{"maxResearch":10,"runQuant":true,"quantLimit":5000,"interval":"5m","feeRate":0.001,"slippageRate":0.0005}' 420 "gem-radar-with-quant"); then
              RADAR_MODE="FULL_QUANT"
            else
              echo "GEM_RADAR_FULL_QUANT_TIMEOUT fallback=discovery_only" >&2
              RADAR_RESULT=$(call_endpoint "/internal/cron/binance/spot-new-assets-discovery" '{"maxResearch":10,"runQuant":false,"interval":"5m","feeRate":0.001,"slippageRate":0.0005}' 180 "gem-radar-discovery-fallback")
              RADAR_MODE="DISCOVERY_FALLBACK"
            fi
            printf '%s\n' "$RADAR_RESULT" | jq --arg mode "$RADAR_MODE" '{ok,duration_ms,execution_mode:$mode,discovery:{baseline:.discovery.baseline,universe_size:.discovery.universe_size,new_assets_detected:.discovery.new_assets_detected},radar:{id:.radar.id,version:.radar.version,universe_size:.radar.universe_size,unique_symbol_count:.radar.unique_symbol_count,research_candidate_count:.radar.research_candidate_count,research_symbols:.radar.research_symbols,quant_run_id:.radar.quant_run_id,quant_promotion_eligible:.radar.quant_promotion_eligible}}'
          }

          run_quant_and_promotion() {
            CORE='["BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","TONUSDT","BNBUSDT","ADAUSDT","DOGEUSDT","LINKUSDT","AVAXUSDT"]'
            MARKET_SYMBOLS=$(printf '%s' "$MARKET_RESULT" | jq -c '.research_symbols // []')
            SYMBOLS=$(jq -nc --argjson core "$CORE" --argjson market "$MARKET_SYMBOLS" '$market + $core | unique | .[:12]')
            QUANT_BODY=$(jq -nc --argjson symbols "$SYMBOLS" '{symbols:$symbols,interval:"5m",limit:5000,feeRate:0.001,slippageRate:0.0005}')

            echo "QUANT_START mode=productive_v6 folds=4 universe=$(printf '%s' "$SYMBOLS" | jq length) market_winners_included=$(printf '%s' "$MARKET_SYMBOLS" | jq length)"
            QUANT_RESULT=$(call_endpoint "/internal/cron/binance/spot-quant-research" "$QUANT_BODY" 420 "quant-research")
            printf '%s\n' "$QUANT_RESULT" | jq '{ok,id,version,history,strategy_families,walk_forward_folds,safeguards,costs,promotion_eligible,no_eligible_champion,selection,selected_evidence}'

            ACCEPTED=$(printf '%s' "$QUANT_RESULT" | jq -r '.selection.accepted_symbol_count // 0')
            ANALYZED=$(printf '%s' "$QUANT_RESULT" | jq -r '.selection.analyzed_count // 0')
            SELECTED=$(printf '%s' "$QUANT_RESULT" | jq -r '.selection.selected_symbol // empty')
            if [ "$ACCEPTED" -le 0 ] || [ "$ANALYZED" -le 0 ]; then
              echo "QUANT_NO_ELIGIBLE_SAMPLE accepted=$ACCEPTED analyzed=$ANALYZED; continuing without treating market conditions as infrastructure failure" >&2
            fi

            PAPER_SYMBOLS=$(printf '%s' "$SYMBOLS" | jq -c '.[0:5]')
            echo "PAPER_REFRESH_START selected_symbol=${SELECTED:-none} candidate_count=$(printf '%s' "$PAPER_SYMBOLS" | jq length)"
            PAPER_BODY=$(jq -nc --argjson symbols "$PAPER_SYMBOLS" --arg selected "$SELECTED" '{preferredSymbols:($symbols + (if ($selected|length)>0 then [$selected] else [] end) | unique),source:"quant_research_market_breadth_v1"}')
            PAPER_RESULT=$(call_endpoint "/internal/cron/binance/spot-paper-validation" "$PAPER_BODY" 180 "paper-validation")
            printf '%s\n' "$PAPER_RESULT" | jq '{ok,paper_only,positions_closed,intents_created,intents_rejected,opened_symbols}'

            echo "PROMOTION_START"
            PROMOTION_RESULT=$(call_endpoint "/internal/cron/binance/spot-strategy-promotion" '{}' 120 "strategy-promotion")
            printf '%s\n' "$PROMOTION_RESULT" | jq '{ok,state,entry_allowed,symbol,reasons,paper,champion_run_id}'
            echo "QUANT_PAPER_PROMOTION_DONE"
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "$MANUAL_TASK" in
              governance) call_endpoint "/internal/cron/binance/spot-cost-governance" '{}' 120 "cost-governance" ;;
              discovery) run_market_opportunity; run_gem_radar ;;
              adaptive) call_endpoint "/internal/cron/binance/spot-adaptive-strategy" '{}' 120 "adaptive-strategy" ;;
              promotion) call_endpoint "/internal/cron/binance/spot-strategy-promotion" '{}' 120 "strategy-promotion" ;;
              quant) run_market_opportunity; run_quant_and_promotion ;;
              all)
                call_endpoint "/internal/cron/binance/spot-cost-governance" '{}' 120 "cost-governance"
                run_market_opportunity
                run_gem_radar
                call_endpoint "/internal/cron/binance/spot-adaptive-strategy" '{}' 120 "adaptive-strategy"
                run_quant_and_promotion
                ;;
            esac
            echo "MANUAL_RESEARCH_COMPLETE task=$MANUAL_TASK"
            exit 0
          fi

          HOUR=$(date -u +%H)
          TOP_HOUR_SLOT=false
          if [ "$SCHEDULE_SLOT" = "7 * * * *" ]; then
            TOP_HOUR_SLOT=true
          fi

          # Discovery and Gem Radar remain at two executions per hour, now at
          # :07 and :37 to avoid crowded GitHub scheduling boundaries.
          run_market_opportunity
          run_gem_radar

          if [ "$TOP_HOUR_SLOT" = "true" ]; then
            call_endpoint "/internal/cron/binance/spot-adaptive-strategy" '{}' 120 "adaptive-strategy"
            call_endpoint "/internal/cron/binance/spot-strategy-promotion" '{}' 120 "strategy-promotion"
          fi

          if [ "$TOP_HOUR_SLOT" = "true" ] && [ $((10#$HOUR % 6)) -eq 0 ]; then
            call_endpoint "/internal/cron/binance/spot-cost-governance" '{}' 120 "cost-governance"
          fi

          if [ "$TOP_HOUR_SLOT" = "true" ] && [ $((10#$HOUR % 2)) -eq 0 ]; then
            run_quant_and_promotion
          fi

          echo "SCHEDULED_RESEARCH_COMPLETE utc_hour=$HOUR schedule_slot=$SCHEDULE_SLOT"

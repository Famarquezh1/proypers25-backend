name: Market Explosion Regime
on:
  pull_request:
    paths: ['backend/scripts/github-market-explosion-regime.js','.github/workflows/market-explosion-regime.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check backend/scripts/github-market-explosion-regime.js
      - run: node backend/scripts/github-market-explosion-regime.js
      - uses: actions/upload-artifact@v4
        with: {name: market-explosion-regime, path: market-explosion-regime.json, retention-days: 30}

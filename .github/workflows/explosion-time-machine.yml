name: Explosion Historical Time Machine
on:
  pull_request:
    paths: ['backend/scripts/github-explosion-time-machine.js','.github/workflows/explosion-time-machine.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check backend/scripts/github-explosion-time-machine.js
      - run: node backend/scripts/github-explosion-time-machine.js
      - uses: actions/upload-artifact@v4
        with: {name: explosion-time-machine, path: explosion-time-machine.json, retention-days: 30}

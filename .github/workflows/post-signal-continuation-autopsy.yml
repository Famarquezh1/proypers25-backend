name: Post Signal Continuation Autopsy
on:
  push:
    branches: [research/post-signal-continuation-autopsy]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
jobs:
  research:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Historical causal autopsy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node backend/scripts/github-post-signal-continuation-autopsy.js

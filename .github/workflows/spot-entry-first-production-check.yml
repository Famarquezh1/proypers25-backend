name: Spot Production Ranking Check

on:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/github-spot-production-radar-v42.js'
      - 'backend/scripts/github-spot-production-radar-v42-active.js'
      - 'backend/scripts/train-spot-qubo-v5.js'
      - 'backend/scripts/train-spot-qubo-counterfactual-v5.js'
      - 'backend/services/spotQuboProductionV5.js'
      - 'backend/config/spot-qubo-production-v5.json'
      - 'backend/config/spot-qubo-training-snapshot-v5.json'
      - 'backend/tests/spotQuboProductionV5.test.js'
      - 'backend/tests/spotQuboCounterfactualLearning.test.js'
      - 'backend/scripts/github-spot-v8-production-shadow.js'
      - 'backend/scripts/github-spot-v8-hunter-shadow-model.js'
      - 'backend/scripts/github-spot-v8-hunter-shadow.js'
      - 'backend/scripts/github-spot-manual-execution-v10-aware.js'
      - 'backend/scripts/github-spot-manual-execution.js'
      - 'backend/scripts/github-spot-auto-exit.js'
      - 'backend/scripts/github-spot-auto-exit-legacy.js'
      - 'backend/scripts/github-spot-auto-exit-legacy-v10-aware.js'
      - 'backend/scripts/github-spot-v61-protect.js'
      - 'backend/scripts/github-xec-historical-protection.js'
      - 'backend/services/xecHistoricalHoldingPolicy.js'
      - 'backend/tests/githubXecNativeProtection.test.js'
      - 'backend/services/paperToRealEntryGate.js'
      - '.github/workflows/spot-github-radar.yml'
      - '.github/workflows/spot-qubo-adaptive-learning.yml'
      - '.github/workflows/spot-v8-hunter-shadow-model.yml'
      - '.github/workflows/spot-auto-exit-local.yml'
      - '.github/workflows/spot-entry-first-production-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/scripts/github-spot-production-radar-v42.js'
      - 'backend/scripts/github-spot-production-radar-v42-active.js'
      - 'backend/scripts/train-spot-qubo-v5.js'
      - 'backend/scripts/train-spot-qubo-counterfactual-v5.js'
      - 'backend/services/spotQuboProductionV5.js'
      - 'backend/config/spot-qubo-production-v5.json'
      - 'backend/config/spot-qubo-training-snapshot-v5.json'
      - 'backend/tests/spotQuboProductionV5.test.js'
      - 'backend/tests/spotQuboCounterfactualLearning.test.js'
      - 'backend/scripts/github-spot-v8-production-shadow.js'
      - 'backend/scripts/github-spot-v8-hunter-shadow-model.js'
      - 'backend/scripts/github-spot-v8-hunter-shadow.js'
      - 'backend/scripts/github-spot-manual-execution-v10-aware.js'
      - 'backend/scripts/github-spot-manual-execution.js'
      - 'backend/scripts/github-spot-auto-exit.js'
      - 'backend/scripts/github-spot-auto-exit-legacy.js'
      - 'backend/scripts/github-spot-auto-exit-legacy-v10-aware.js'
      - 'backend/scripts/github-spot-v61-protect.js'
      - 'backend/scripts/github-xec-historical-protection.js'
      - 'backend/services/xecHistoricalHoldingPolicy.js'
      - 'backend/tests/githubXecNativeProtection.test.js'
      - 'backend/services/paperToRealEntryGate.js'
      - '.github/workflows/spot-github-radar.yml'
      - '.github/workflows/spot-qubo-adaptive-learning.yml'
      - '.github/workflows/spot-v8-hunter-shadow-model.yml'
      - '.github/workflows/spot-auto-exit-local.yml'
      - '.github/workflows/spot-entry-first-production-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check backend/scripts/github-spot-production-radar-v42.js
          node --check backend/scripts/github-spot-production-radar-v42-active.js
          node --check backend/scripts/train-spot-qubo-v5.js
          node --check backend/scripts/train-spot-qubo-counterfactual-v5.js
          node --check backend/services/spotQuboProductionV5.js
          node --check backend/tests/spotQuboProductionV5.test.js
          node --check backend/tests/spotQuboCounterfactualLearning.test.js
          node --check backend/scripts/github-spot-v8-production-shadow.js
          node --check backend/scripts/github-spot-v8-hunter-shadow-model.js
          node --check backend/scripts/github-spot-v8-hunter-shadow.js
          node --check backend/scripts/github-spot-manual-execution-v10-aware.js
          node --check backend/scripts/github-spot-manual-execution.js
          node --check backend/scripts/github-spot-auto-exit.js
          node --check backend/scripts/github-spot-auto-exit-legacy.js
          node --check backend/scripts/github-spot-auto-exit-legacy-v10-aware.js
          node --check backend/scripts/github-spot-v61-protect.js
          node --check backend/scripts/github-xec-historical-protection.js
          node --check backend/services/xecHistoricalHoldingPolicy.js
          node --check backend/tests/githubXecNativeProtection.test.js
          node --check backend/services/paperToRealEntryGate.js
      - name: QUBO V5 training and hardware-ready tests
        run: |
          node backend/scripts/train-spot-qubo-v5.js --verify
          node backend/tests/spotQuboProductionV5.test.js
          node backend/tests/spotQuboCounterfactualLearning.test.js
      - name: XEC native protection tests
        run: node backend/tests/githubXecNativeProtection.test.js
      - name: Active Spot universe smoke check
        shell: bash
        run: |
          set -euo pipefail
          RESULT=$(node backend/scripts/github-spot-production-radar-v42-active.js)
          printf '%s\n' "$RESULT"
          test "$(printf '%s' "$RESULT" | jq -r '.ok // false')" = "true"
      - name: Guard production invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "V42_MIN_PASS_WINDOWS = 2" backend/scripts/github-spot-production-radar-v42.js
          grep -q "v42_pass_windows >= V42_MIN_PASS_WINDOWS" backend/scripts/github-spot-production-radar-v42.js
          grep -q "solveHardwareReadyQubo" backend/scripts/github-spot-production-radar-v42.js
          grep -q "productionUtility" backend/scripts/github-spot-production-radar-v42.js
          grep -q '"mode": "PRODUCTION"' backend/config/spot-qubo-production-v5.json
          grep -q '"base": 0.55' backend/config/spot-qubo-production-v5.json
          grep -q '"stable": 0.05' backend/config/spot-qubo-production-v5.json
          grep -q '"v42": 0.40' backend/config/spot-qubo-production-v5.json
          grep -q "HARDWARE_SCHEMA = 'BINARY_QUADRATIC_MODEL_QUBO_V1'" backend/services/spotQuboProductionV5.js
          grep -q "cardinality_slack" backend/services/spotQuboProductionV5.js
          grep -q "normalized_quadratic" backend/services/spotQuboProductionV5.js
          grep -q "QUBO_V5_ADAPTIVE_CONFIG" backend/services/spotQuboProductionV5.js
          grep -q "adaptive_state" backend/scripts/github-spot-production-radar-v42.js
          grep -q "spot-qubo-adaptive-learning.yml" .github/workflows/spot-github-radar.yml
          grep -q "QUBO_CF_MAX_SIGNALS: '160'" .github/workflows/spot-qubo-adaptive-learning.yml
          grep -q "includes_declined: true" backend/scripts/train-spot-qubo-counterfactual-v5.js
          grep -q "declined_missed_wins" backend/scripts/train-spot-qubo-counterfactual-v5.js
          ! grep -Eq 'firebase-admin|firestore|gcloud|cloud run' backend/scripts/train-spot-qubo-counterfactual-v5.js .github/workflows/spot-qubo-adaptive-learning.yml
          ! grep -q "entry_first_enabled: true" backend/scripts/github-spot-production-radar-v42.js
          ! grep -q "legacy \* 0.75 + entryFirst \* 0.25" backend/scripts/github-spot-production-radar-v42.js
          grep -q "status !== 'TRADING'" backend/scripts/github-spot-production-radar-v42-active.js
          grep -q "isSpotTradingAllowed === false" backend/scripts/github-spot-production-radar-v42-active.js
          grep -q "refusing unfiltered radar" backend/scripts/github-spot-production-radar-v42-active.js
          grep -q "mode:'V8_SHADOW_ONLY'" backend/scripts/github-spot-v8-production-shadow.js
          grep -q "decisionInfluence:false" backend/scripts/github-spot-v8-production-shadow.js
          grep -q "productionAction:'NONE_V8_SHADOW'" backend/scripts/github-spot-v8-production-shadow.js
          ! grep -Eq 'BINANCE_(API|SECRET)_KEY|firebase-admin|firestore|placeOrder|createOrder|withdraw' backend/scripts/github-spot-v8-production-shadow.js
          grep -q "version:'V8_HUNTER_SHADOW_MODEL_V1'" backend/scripts/github-spot-v8-hunter-shadow-model.js
          grep -q "productionAction:'NONE'" backend/scripts/github-spot-v8-hunter-shadow-model.js
          grep -q "mode:'V8_HUNTER_INDEPENDENT_SHADOW'" backend/scripts/github-spot-v8-hunter-shadow.js
          grep -q "decisionInfluence:false" backend/scripts/github-spot-v8-hunter-shadow.js
          grep -q "productionAction:'NONE'" backend/scripts/github-spot-v8-hunter-shadow.js
          ! grep -Eq 'BINANCE_(API|SECRET)_KEY|firebase-admin|firestore|placeOrder|createOrder|withdraw|gh workflow run' backend/scripts/github-spot-v8-hunter-shadow-model.js backend/scripts/github-spot-v8-hunter-shadow.js
          grep -q "if: steps.scan.outputs.notify == 'true'" .github/workflows/spot-github-radar.yml
          grep -q "V8 HUNTER: scanner independiente cada 5m; peso de ejecución = 0" .github/workflows/spot-github-radar.yml
          grep -q "maximum_real_order_usdt: 10" backend/services/paperToRealEntryGate.js
          grep -Fq "source = source.replace(/\\r\\n/g, '\\n');" backend/scripts/github-spot-manual-execution-v10-aware.js
          ! grep -q "MAX_OPEN_POSITIONS" backend/scripts/github-spot-manual-execution-v10-aware.js
          ! grep -q "MAX_TOTAL_CAPITAL_USDT" backend/scripts/github-spot-manual-execution-v10-aware.js
          ! grep -q "Managed Spot position limit reached" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -q "XEC historical holding is exit-only; new XEC entries are disabled" backend/scripts/github-spot-manual-execution-v10-aware.js
          grep -Fq "[\\p{L}\\p{N}._-]{1,24}USDT" backend/scripts/github-spot-manual-execution.js
          TITLE='[SPOT SIGNAL] WUSDT +12.768%'
          SYMBOL=$(printf '%s' "$TITLE" | sed -n 's/^\[SPOT SIGNAL\] \([^[:space:]]*USDT\).*/\1/p')
          test "$SYMBOL" = "WUSDT"
          grep -q "github-xec-historical-protection.js" backend/scripts/github-spot-auto-exit.js
          grep -q "fast_arm_recovery_pct" backend/services/xecHistoricalHoldingPolicy.js
          grep -q "FAST_RECOVERY" backend/services/xecHistoricalHoldingPolicy.js
          grep -q "enableWithdrawals !== false" backend/scripts/github-xec-historical-protection.js
          grep -q "RECOVERY_RUNNER_PROGRESSIVE_EXIT" backend/scripts/github-xec-historical-protection.js
          grep -Fq ".replace(/\\r\\n/g, '\\n')" backend/scripts/github-spot-auto-exit-legacy-v10-aware.js
          grep -Fq 'proypers-gh-protect-v61-${Date.now().toString(36)}' backend/scripts/github-spot-v61-protect.js
          node - <<'NODE'
          const id = `proypers-gh-protect-v61-${Date.now().toString(36)}`;
          if (id.length > 36) throw new Error(`Binance clientOrderId too long: ${id.length}`);
          if (!/^[a-zA-Z0-9-_]{1,36}$/.test(id)) throw new Error(`Binance clientOrderId illegal: ${id}`);
          console.log(`Binance protective clientOrderId guard OK length=${id.length}`);
          NODE
          echo 'V4.2/QUBO V5 hardware-ready remains production authority. Counterfactual learning includes executed and declined opportunities, is bounded to 160 signals, promotes weights only on recent holdout improvement, and uses no GCloud/Firestore or PC-local training memory.'

name: Spot Production Ranking Check

on:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/github-spot-production-radar-v42.js'
      - 'backend/scripts/github-spot-production-radar-v42-active.js'
      - 'backend/scripts/github-spot-v8-production-shadow.js'
      - 'backend/scripts/github-spot-auto-exit.js'
      - 'backend/scripts/github-spot-auto-exit-legacy.js'
      - 'backend/scripts/github-spot-auto-exit-legacy-v10-aware.js'
      - 'backend/scripts/github-spot-v61-protect.js'
      - 'backend/services/paperToRealEntryGate.js'
      - '.github/workflows/spot-github-radar.yml'
      - '.github/workflows/spot-auto-exit-local.yml'
      - '.github/workflows/spot-entry-first-production-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/scripts/github-spot-production-radar-v42.js'
      - 'backend/scripts/github-spot-production-radar-v42-active.js'
      - 'backend/scripts/github-spot-v8-production-shadow.js'
      - 'backend/scripts/github-spot-auto-exit.js'
      - 'backend/scripts/github-spot-auto-exit-legacy.js'
      - 'backend/scripts/github-spot-auto-exit-legacy-v10-aware.js'
      - 'backend/scripts/github-spot-v61-protect.js'
      - 'backend/services/paperToRealEntryGate.js'
      - '.github/workflows/spot-github-radar.yml'
      - '.github/workflows/spot-auto-exit-local.yml'
      - '.github/workflows/spot-entry-first-production-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check backend/scripts/github-spot-production-radar-v42.js
          node --check backend/scripts/github-spot-production-radar-v42-active.js
          node --check backend/scripts/github-spot-v8-production-shadow.js
          node --check backend/scripts/github-spot-auto-exit.js
          node --check backend/scripts/github-spot-auto-exit-legacy.js
          node --check backend/scripts/github-spot-auto-exit-legacy-v10-aware.js
          node --check backend/scripts/github-spot-v61-protect.js
          node --check backend/services/paperToRealEntryGate.js
      - name: Active Spot universe smoke check
        shell: bash
        run: |
          set -euo pipefail
          RESULT=$(node backend/scripts/github-spot-production-radar-v42-active.js)
          printf '%s\n' "$RESULT"
          test "$(printf '%s' "$RESULT" | jq -r '.ok // false')" = "true"
      - name: Guard production invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "V42_MIN_PASS_WINDOWS = 2" backend/scripts/github-spot-production-radar-v42.js
          grep -q "v42_pass_windows >= V42_MIN_PASS_WINDOWS" backend/scripts/github-spot-production-radar-v42.js
          grep -q "base \* 0.40 + stable \* 0.15 + v42 \* 0.45" backend/scripts/github-spot-production-radar-v42.js
          ! grep -q "entry_first_enabled: true" backend/scripts/github-spot-production-radar-v42.js
          ! grep -q "legacy \* 0.75 + entryFirst \* 0.25" backend/scripts/github-spot-production-radar-v42.js
          grep -q "status !== 'TRADING'" backend/scripts/github-spot-production-radar-v42-active.js
          grep -q "isSpotTradingAllowed === false" backend/scripts/github-spot-production-radar-v42-active.js
          grep -q "refusing unfiltered radar" backend/scripts/github-spot-production-radar-v42-active.js
          grep -q "mode:'V8_SHADOW_ONLY'" backend/scripts/github-spot-v8-production-shadow.js
          grep -q "decisionInfluence:false" backend/scripts/github-spot-v8-production-shadow.js
          grep -q "productionAction:'NONE_V8_SHADOW'" backend/scripts/github-spot-v8-production-shadow.js
          ! grep -Eq 'BINANCE_(API|SECRET)_KEY|firebase-admin|firestore|placeOrder|createOrder|withdraw' backend/scripts/github-spot-v8-production-shadow.js
          ! grep -Eq 'if:.*v8shadow' .github/workflows/spot-github-radar.yml
          grep -q "if: steps.scan.outputs.notify == 'true'" .github/workflows/spot-github-radar.yml
          grep -q "maximum_real_order_usdt: 10" backend/services/paperToRealEntryGate.js
          grep -Fq ".replace(/\\r\\n/g, '\\n')" backend/scripts/github-spot-auto-exit-legacy-v10-aware.js
          grep -Fq 'proypers-gh-protect-v61-${Date.now().toString(36)}' backend/scripts/github-spot-v61-protect.js
          node - <<'NODE'
          const id = `proypers-gh-protect-v61-${Date.now().toString(36)}`;
          if (id.length > 36) throw new Error(`Binance clientOrderId too long: ${id.length}`);
          if (!/^[a-zA-Z0-9-_]{1,36}$/.test(id)) throw new Error(`Binance clientOrderId illegal: ${id}`);
          console.log(`Binance protective clientOrderId guard OK length=${id.length}`);
          NODE
          echo 'V4.2/QUBO remains execution authority. V8 is production shadow only. Active Spot fail-safe, 10 USDT cap, Windows exit wrapper compatibility, and Binance-safe protective IDs preserved.'

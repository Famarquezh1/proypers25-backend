name: CORE Post-Signal Resilience Shadow
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  prepare:
    if: startsWith(github.event.issue.title, '[SPOT SIGNAL] ')
    runs-on: ubuntu-latest
    outputs:
      symbol: ${{ steps.s.outputs.symbol }}
      lane: ${{ steps.s.outputs.lane }}
      price: ${{ steps.s.outputs.price }}
    steps:
      - id: s
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          SYMBOL=$(printf '%s' "$TITLE" | sed -n 's/^\[SPOT SIGNAL\] \([^[:space:]]*USDT\).*/\1/p')
          LANE=$(printf '%s' "$BODY" | sed -n 's/^- Lane: \([A-Z0-9_-]*\).*/\1/p' | head -1)
          PRICE=$(printf '%s' "$BODY" | sed -n 's/^- Precio: \([0-9.eE+-]*\).*/\1/p' | head -1)
          echo "symbol=$SYMBOL" >> "$GITHUB_OUTPUT"
          echo "lane=${LANE:-CORE}" >> "$GITHUB_OUTPUT"
          echo "price=$PRICE" >> "$GITHUB_OUTPUT"
  observe:
    needs: prepare
    if: needs.prepare.outputs.lane == 'CORE'
    runs-on: [self-hosted, Windows, X64, research-only, research-light]
    timeout-minutes: 8
    env:
      LR_SYMBOLS: ${{ needs.prepare.outputs.symbol }}
      LR_RUN_MS: '240000'
      SIGNAL_PRICE: ${{ needs.prepare.outputs.price }}
      SIGNAL_CREATED_AT: ${{ github.event.issue.created_at }}
      SIGNAL_ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Write signal metadata
        shell: powershell
        run: |
          [ordered]@{symbol=$env:LR_SYMBOLS;signal_price=$env:SIGNAL_PRICE;signal_created_at=$env:SIGNAL_CREATED_AT;issue_number=$env:SIGNAL_ISSUE;shadow_only=$true;no_order_created=$true} | ConvertTo-Json -Compress | Set-Content -Encoding utf8 core-post-signal-metadata.json
      - name: Prepare websocket dependency
        shell: powershell
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'core-resilience-deps'
          if (Test-Path $deps) { Remove-Item -Recurse -Force $deps }
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          npm install --no-save --ignore-scripts --prefix $deps ws
          "NODE_PATH=$deps\node_modules" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Syntax check
        run: node --check backend/scripts/github-liquidity-resilience-shadow.js
      - name: Observe public depth and trades
        run: node backend/scripts/github-liquidity-resilience-shadow.js
      - name: Upload observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-post-signal-resilience-${{ needs.prepare.outputs.symbol }}-${{ github.run_id }}
          path: |
            core-post-signal-metadata.json
            liquidity-resilience-shadow.ndjson
          retention-days: 30

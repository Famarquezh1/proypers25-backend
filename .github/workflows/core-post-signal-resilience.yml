name: CORE Post-Signal Resilience Shadow

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      symbol:
        description: 'USDT symbol for research-only collector'
        required: true
        type: string
      signal_price:
        description: 'Optional reference price'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: core-post-signal-resilience-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  observe:
    name: Observe CORE post-signal liquidity
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        startsWith(github.event.issue.title, '[SPOT SIGNAL] ') &&
        (
          contains(github.event.issue.body, '- Lane: CORE') ||
          !contains(github.event.issue.body, '- Lane:')
        )
      )
    runs-on: [self-hosted, Windows, X64, research-only, research-light]
    timeout-minutes: 8
    env:
      LR_RUN_MS: '240000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve CORE signal
        id: signal
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $symbol = "${{ inputs.symbol }}".Trim().ToUpper()
            $price = "${{ inputs.signal_price }}".Trim()
            $created = (Get-Date).ToUniversalTime().ToString("o")
            $issue = ""
          } else {
            $title = @'
${{ github.event.issue.title }}
'@
            $body = @'
${{ github.event.issue.body }}
'@
            if ($title -notmatch '^\[SPOT SIGNAL\]\s+([^\s]+USDT)') { throw "Cannot resolve signal symbol" }
            $symbol = $Matches[1].ToUpper()
            $price = ""
            if ($body -match '(?m)^- Precio:\s*([0-9.eE+\-]+)') { $price = $Matches[1] }
            $created = "${{ github.event.issue.created_at }}"
            $issue = "${{ github.event.issue.number }}"
          }
          if ($symbol -notmatch '^[A-Z0-9]+USDT$') { throw "Invalid USDT symbol: $symbol" }
          "symbol=$symbol" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "signal_price=$price" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "created_at=$created" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "issue_number=$issue" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "LR_SYMBOLS=$symbol" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Record signal metadata
        shell: powershell
        env:
          SIGNAL_SYMBOL: ${{ steps.signal.outputs.symbol }}
          SIGNAL_PRICE: ${{ steps.signal.outputs.signal_price }}
          SIGNAL_CREATED_AT: ${{ steps.signal.outputs.created_at }}
          SIGNAL_ISSUE: ${{ steps.signal.outputs.issue_number }}
        run: |
          [ordered]@{
            type = 'core_post_signal_observation'
            shadow_only = $true
            no_order_created = $true
            symbol = $env:SIGNAL_SYMBOL
            signal_price = $env:SIGNAL_PRICE
            signal_created_at = $env:SIGNAL_CREATED_AT
            issue_number = $env:SIGNAL_ISSUE
            observation_started_at = (Get-Date).ToUniversalTime().ToString("o")
            observation_window_ms = [int]$env:LR_RUN_MS
          } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 core-post-signal-metadata.json

      - name: Prepare isolated websocket dependency
        shell: powershell
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'core-post-signal-resilience-deps'
          if (Test-Path $deps) { Remove-Item -Recurse -Force $deps }
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          npm install --no-save --ignore-scripts --prefix $deps ws
          "NODE_PATH=$deps\node_modules" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Syntax check
        run: node --check backend/scripts/github-liquidity-resilience-shadow.js

      - name: Observe public depth and trades
        run: node backend/scripts/github-liquidity-resilience-shadow.js

      - name: Upload CORE post-signal observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-post-signal-resilience-${{ steps.signal.outputs.symbol }}-${{ github.run_id }}
          path: |
            core-post-signal-metadata.json
            liquidity-resilience-shadow.ndjson
          if-no-files-found: warn
          retention-days: 30

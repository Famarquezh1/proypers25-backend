name: Spot Monetization Edge Research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'backend/scripts/train-spot-monetization-edge.js'
      - '.github/workflows/spot-monetization-edge.yml'

permissions:
  contents: read

concurrency:
  group: spot-monetization-edge
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HIST_POOL_SIZE: '60'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guard research only
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/scripts/train-spot-monetization-edge.js
          grep -q "production_mutation:false" backend/scripts/train-spot-monetization-edge.js
          ! grep -q "api/v3/order\|BINANCE_SECRET\|withdraw" backend/scripts/train-spot-monetization-edge.js
      - name: Train monetization edge
        run: node backend/scripts/train-spot-monetization-edge.js
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: spot-monetization-edge-${{ github.run_id }}
          path: backend/training-output/spot-monetization-edge.json
          retention-days: 30
      - name: Summary
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const r=require('./backend/training-output/spot-monetization-edge.json');
          console.log('### Monetization Edge — research only');
          console.log(`- Candidates: ${r.candidate_count}; viable walk-forward: ${r.viable_count}`);
          console.log(`- Selected: ${r.selected ? `opp λ=${r.selected.lambda_opportunity}, mon λ=${r.selected.lambda_monetization}, mix=${r.selected.mix}, keep=${r.selected.keep}` : 'none'}`);
          console.log(`- Fresh holdout pass: ${r.confirmation_pass}`);
          console.log(`- Decision: ${r.decision.label}`);
          if(r.confirmation){
            const d=r.confirmation.delta;
            console.log(`- Δ net growth: ${(100*d.net_growth).toFixed(3)} pp`);
            console.log(`- Δ avg net return: ${(100*d.avg_net_ret).toFixed(3)} pp`);
            console.log(`- Δ max drawdown: ${(100*d.max_drawdown).toFixed(3)} pp`);
            console.log(`- Δ +5% precision: ${(100*d.winner5_precision).toFixed(2)} pp`);
            console.log(`- Δ +10% precision: ${(100*d.winner10_precision).toFixed(2)} pp`);
          }
          NODE

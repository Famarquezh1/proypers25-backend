name: Spot CORE TimesFM Mature Evaluation
on:
  workflow_dispatch:
    inputs:
      symbol:
        required: false
        type: string
      price:
        required: false
        type: string
      signal_created_at:
        required: false
        type: string
      signal_issue:
        required: false
        type: string
      forecast_edge_pct:
        required: false
        type: string
      selected_shadow_buy:
        required: false
        type: string
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'research/timesfm/evaluate_recent_mature.py'
      - '.github/workflows/spot-core-timesfm-mature-evaluation.yml'
permissions:
  contents: read
  actions: read
jobs:
  evaluate-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.symbol != ''
    runs-on: [self-hosted, Windows, X64, research-only, research-light]
    timeout-minutes: 3
    env:
      SIGNAL_SYMBOL: ${{ inputs.symbol }}
      SIGNAL_PRICE: ${{ inputs.price }}
      SIGNAL_CREATED_AT: ${{ inputs.signal_created_at }}
      SIGNAL_ISSUE: ${{ inputs.signal_issue }}
      FORECAST_EDGE_PCT: ${{ inputs.forecast_edge_pct }}
      SELECTED_SHADOW_BUY: ${{ inputs.selected_shadow_buy }}
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate frozen decision against Binance history
        shell: powershell
        run: |
          $py='C:\Users\Famarquezh1\AppData\Local\Programs\Python\Python313\python.exe'
          if (-not (Test-Path $py)) { throw 'Python 3.13 unavailable' }
          & $py research/timesfm/evaluate_mature_shadow.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: core-timesfm-mature-${{ inputs.symbol }}-${{ github.run_id }}
          path: core-timesfm-mature-evaluation.json
          retention-days: 30

  evaluate-recent:
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Evaluate recent mature frozen decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/timesfm/evaluate_recent_mature.py
      - uses: actions/upload-artifact@v4
        with:
          name: core-timesfm-mature-batch-${{ github.run_id }}
          path: core-timesfm-mature-batch.json
          retention-days: 30

name: Spot CORE TimesFM Historical Benchmark
on:
  push:
    branches: [main]
    paths:
      - 'research/timesfm/core_benchmark.py'
      - '.github/workflows/spot-core-timesfm-benchmark.yml'
permissions:
  contents: read
  issues: read
jobs:
  benchmark:
    name: CORE TimesFM retrospective benchmark
    runs-on: [self-hosted, Windows, X64, research-only, research-light]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Use Python 3.13
        shell: powershell
        run: |
          $py='C:\Users\Famarquezh1\AppData\Local\Programs\Python\Python313\python.exe'
          if (-not (Test-Path $py)) { throw 'Python 3.13 unavailable' }
          "PROYPERS_PY=$py" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $cache=Join-Path $env:RUNNER_TEMP 'timesfm-hf-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "HF_HOME=$cache" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build CORE cohort from signal issues
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          import json,os,subprocess
          rows=[]
          for page in range(1,11):
              url=f"repos/{os.environ['GITHUB_REPOSITORY']}/issues?state=all&per_page=100&page={page}"
              p=subprocess.run(["gh","api",url],capture_output=True,text=True,check=True)
              batch=json.loads(p.stdout)
              if not batch: break
              rows.extend(x for x in batch if "pull_request" not in x)
              if len(batch)<100: break
          slim=[{"number":x["number"],"title":x["title"],"body":x.get("body") or "","createdAt":x["created_at"],"url":x["html_url"]} for x in rows]
          json.dump(slim,open("issues.json","w"),ensure_ascii=False)
          print("issues="+str(len(slim)))
          '@ | Set-Content fetch_issues.py -Encoding utf8
          & $env:PROYPERS_PY fetch_issues.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json,re
          a=json.load(open("issues.json",encoding="utf-8-sig"))
          out=[]
          for x in a:
              body=x.get("body") or ""
              if not x["title"].startswith("[SPOT SIGNAL] ") or "Lane: V10_HUNTER" in body:
                  continue
              m=re.search(r"^- Precio: ([0-9.eE+-]+)",body,re.M)
              if not m:
                  continue
              out.append({"issue":x["number"],"url":x["url"],"symbol":x["title"].split()[2],"signal_price":float(m.group(1)),"created_at":x["createdAt"]})
          json.dump({"signals":out},open("core-timesfm-input.json","w"),indent=2)
          print("signals="+str(len(out)))
          '@ | Set-Content build_cohort.py -Encoding utf8
          & $env:PROYPERS_PY build_cohort.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ensure TimesFM 2.5 runtime
        shell: powershell
        run: |
          & $env:PROYPERS_PY -m pip install --quiet "timesfm[torch]==2.0.2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Forecast historical CORE contexts
        shell: powershell
        run: |
          & $env:PROYPERS_PY research/timesfm/core_benchmark.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-timesfm-benchmark-${{ github.run_id }}
          path: |
            core-timesfm-input.json
            core-timesfm-results.json
          retention-days: 30

name: QPU Realtime Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: qpu-realtime-shadow
  cancel-in-progress: false

jobs:
  collect:
    runs-on: [self-hosted, Windows, X64, research-only]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare isolated websocket dependency
        shell: powershell
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'qpu-realtime-shadow-deps'
          if (Test-Path $deps) { Remove-Item -Recurse -Force $deps }
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          npm install --no-save --ignore-scripts --prefix $deps ws
          "NODE_PATH=$deps\node_modules" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Safety check
        shell: powershell
        run: |
          node --check backend/scripts/github-qpu-realtime-shadow.js
          $src = Get-Content backend/scripts/github-qpu-realtime-shadow.js -Raw
          if ($src -match 'api/v3/order|fapi/v1/order|BINANCE_API_KEY|BINANCE_SECRET|firebase-admin|createOrder|placeOrder|withdraw') {
            throw 'Forbidden execution capability detected'
          }

      - name: Collect continuous public microstructure
        env:
          LR_RUN_MS: '600000'
          LR_OUT: 'qpu-realtime-shadow.ndjson'
        run: node backend/scripts/github-qpu-realtime-shadow.js

      - name: Summarize capture
        shell: powershell
        run: |
          node -e "const fs=require('fs');const p='qpu-realtime-shadow.ndjson';const a=fs.existsSync(p)?fs.readFileSync(p,'utf8').trim().split(/\\r?\\n/).filter(Boolean):[];let c=0,s=0,d=0,g=0;for(const l of a){try{const x=JSON.parse(l);if(x.type==='resilience_curve')c++;if(x.type==='resilience_state_v2'){s++;if(x.directional_candidate)d++;}if(x.type==='sequence_gap')g++;}catch{}}console.log(JSON.stringify({rows:a.length,resilience_curves:c,state_updates:s,directional_candidates:d,sequence_gaps:g},null,2));"

      - uses: actions/upload-artifact@v4
        with:
          name: qpu-realtime-shadow-${{ github.run_id }}
          path: qpu-realtime-shadow.ndjson
          retention-days: 30

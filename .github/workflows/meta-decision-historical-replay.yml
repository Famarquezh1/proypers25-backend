name: Meta Decision Historical Replay

on:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/github-meta-decision-historical-replay.js'
      - 'backend/services/spotMetaDecisionEngine.js'
      - '.github/workflows/meta-decision-historical-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: [self-hosted, Windows, X64, research-only]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Historical replay
        shell: powershell
        run: |
          $mem = Join-Path $env:USERPROFILE ".proypers25\local-pretrade-memory.jsonl"
          Write-Host "Using memory: $mem"
          node backend/scripts/github-meta-decision-historical-replay.js "$mem" meta-decision-historical-replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: meta-decision-historical-replay-${{ github.run_id }}
          path: meta-decision-historical-replay.json
          retention-days: 3

name: Spot Explosion Precursor Trainer V4.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/scripts/github-spot-explosion-precursor-trainer-v4_1.js'
      - '.github/workflows/spot-explosion-precursor-trainer-v4_1.yml'

permissions:
  contents: read

concurrency:
  group: spot-explosion-precursor-trainer-v4-1
  cancel-in-progress: true

jobs:
  train:
    name: Explosion V4.1 ${{ matrix.days }}d
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        days: [30, 45, 60]
    env:
      TRAIN_LOOKBACK_DAYS: ${{ matrix.days }}
      TRAIN_MAX_SYMBOLS: '24'
      MIN_HIST_QUOTE_VOL_24H: '500000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run hardened explosion precursor trainer
        working-directory: backend
        run: node scripts/github-spot-explosion-precursor-trainer-v4_1.js
      - name: Upload V4.1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spot-explosion-v4-1-${{ matrix.days }}d-${{ github.run_id }}
          path: |
            backend/training-output/spot-explosion-v4_1-report.json
            backend/training-output/spot-explosion-v4_1-champion.json
          if-no-files-found: warn
          retention-days: 14
      - name: V4.1 window summary
        if: success()
        working-directory: backend
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const r=require('./training-output/spot-explosion-v4_1-report.json');
          console.log(`### Explosion V4.1 ${r.lookbackDays}d`);
          console.log(`- Samples: ${r.samples}`);
          console.log(`- Champion: ${r.champion?.agent || 'none'}`);
          console.log(`- Gate: ${r.productionGate.pass ? 'PASS' : 'HOLD'}`);
          if(r.champion){
            const p=r.champion.test.portfolio,d=r.champion.test.diag;
            console.log(`- Test trades/30d: ${p.tradesPer30.toFixed(2)}`);
            console.log(`- Test net growth: ${(p.netGrowth*100).toFixed(2)}%`);
            console.log(`- Test DD: ${(p.maxDrawdown*100).toFixed(2)}%`);
            console.log(`- Test hit +10/+20/+40/+80: ${(d.hit10*100).toFixed(1)}% / ${(d.hit20*100).toFixed(1)}% / ${(d.hit40*100).toFixed(1)}% / ${(d.hit80*100).toFixed(1)}%`);
            console.log(`- Avg hold: ${d.avgHold.toFixed(0)} min`);
          }
          NODE

  consolidate:
    name: Explosion V4.1 cross-window gate
    needs: train
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download V4.1 evidence
        uses: actions/download-artifact@v4
        with:
          pattern: spot-explosion-v4-1-*-${{ github.run_id }}
          path: v4-1-combined
          merge-multiple: false
      - name: Consolidate V4.1
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const reports=[];
          function walk(d){if(!fs.existsSync(d))return;for(const n of fs.readdirSync(d)){const p=path.join(d,n),s=fs.statSync(p);if(s.isDirectory())walk(p);else if(n==='spot-explosion-v4_1-report.json')reports.push(JSON.parse(fs.readFileSync(p,'utf8')));}}
          walk('v4-1-combined');reports.sort((a,b)=>a.lookbackDays-b.lookbackDays);
          const by={};
          for(const r of reports){for(const x of r.results){const a=by[x.agent]||(by[x.agent]={agent:x.agent,windows:0,pass:0,growth:[],trades:[],dd:[],h10:[],h20:[],h40:[],h80:[],hold:[]});a.windows++;const p=x.test.portfolio,d=x.test.diag;a.growth.push(p.netGrowth);a.trades.push(p.tradesPer30);a.dd.push(p.maxDrawdown);a.h10.push(d.hit10);a.h20.push(d.hit20);a.h40.push(d.hit40);a.h80.push(d.hit80);a.hold.push(d.avgHold);if(x.validation.portfolio.netGrowth>0&&p.netGrowth>0&&p.tradesPer30>=4&&p.maxDrawdown>-.20&&d.hit10>0)a.pass++;}}
          const av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
          const rank=Object.values(by).map(a=>({agent:a.agent,windows:a.windows,robustWindows:a.pass,avgNetGrowth:av(a.growth),avgTrades30:av(a.trades),worstDD:Math.min(...a.dd),avgHit10:av(a.h10),avgHit20:av(a.h20),avgHit40:av(a.h40),avgHit80:av(a.h80),avgHoldMin:av(a.hold)})).sort((a,b)=>(b.robustWindows-a.robustWindows)||(b.avgNetGrowth-a.avgNetGrowth)||(b.avgHit20-a.avgHit20));
          const stable=rank.filter(x=>x.windows===reports.length&&x.robustWindows===reports.length&&x.avgTrades30>=4&&x.avgNetGrowth>0&&x.worstDD>-.20);
          const summary={generatedAt:new Date().toISOString(),version:'V4.1',windows:reports.map(r=>({days:r.lookbackDays,champion:r.champion?.agent||null,gate:r.productionGate})),ranking:rank,stableChampions:stable,productionGate:{pass:stable.length>0,reason:stable.length?'stable short-horizon precursor champion across 30/45/60d with untouched-test profitability':'HOLD: no agent cleared all 30/45/60d robustness gates'}};
          fs.writeFileSync('spot-explosion-v4_1-cross-window-summary.json',JSON.stringify(summary,null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n### Explosion V4.1 cross-window\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`- Stable champions: ${stable.map(x=>x.agent).join(', ')||'none'}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`- Gate: ${summary.productionGate.pass?'PASS':'HOLD'}\n`);
          for(const x of rank.slice(0,6))fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`- ${x.agent}: growth ${(x.avgNetGrowth*100).toFixed(2)}%, +10 ${(x.avgHit10*100).toFixed(1)}%, +20 ${(x.avgHit20*100).toFixed(1)}%, +40 ${(x.avgHit40*100).toFixed(1)}%, trades/30d ${x.avgTrades30.toFixed(1)}, DD ${(x.worstDD*100).toFixed(1)}%, robust ${x.robustWindows}/${x.windows}\n`);
          NODE
      - name: Upload V4.1 consolidated evidence
        uses: actions/upload-artifact@v4
        with:
          name: spot-explosion-v4-1-cross-window-${{ github.run_id }}
          path: spot-explosion-v4_1-cross-window-summary.json
          retention-days: 14

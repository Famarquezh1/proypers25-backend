name: Spot Manual Approval

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de aprobación'
        required: true
        default: test
        type: choice
        options:
          - test
          - real

permissions:
  contents: read
  issues: write

concurrency:
  group: spot-manual-approval
  cancel-in-progress: false

jobs:
  approve:
    name: Validate latest signal and execute only after manual Run workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY || secrets.BINANCE_SECRET || secrets.BINANCE_API_SECRET || secrets.BINANCE_FUTURES_API_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve latest signal
        id: signal
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "test" ]; then
            JSON=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'SPOT SIGNAL TEST in:title' --limit 20 --json number,title,body,createdAt --jq 'sort_by(.createdAt) | reverse | .[0]')
            test -n "$JSON" && test "$JSON" != "null"
            NUMBER=$(printf '%s' "$JSON" | jq -r '.number')
            CREATED=$(printf '%s' "$JSON" | jq -r '.createdAt')
            echo "issue_number=$NUMBER" >> "$GITHUB_OUTPUT"
            echo 'symbol=TESTUSDT' >> "$GITHUB_OUTPUT"
            echo 'pct=4.20' >> "$GITHUB_OUTPUT"
            echo 'price=0.12345' >> "$GITHUB_OUTPUT"
            echo "created_at=$CREATED" >> "$GITHUB_OUTPUT"
            echo 'test=true' >> "$GITHUB_OUTPUT"
            echo 'SIGNAL_SYMBOL=TESTUSDT' >> "$GITHUB_ENV"
            echo 'SIGNAL_PCT=4.20' >> "$GITHUB_ENV"
            echo 'SIGNAL_PRICE=0.12345' >> "$GITHUB_ENV"
            echo "SIGNAL_CREATED_AT=$CREATED" >> "$GITHUB_ENV"
            exit 0
          fi

          JSON=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '[SPOT SIGNAL] in:title' --limit 50 --json number,title,body,createdAt --jq '[.[] | select(.title | startswith("[SPOT SIGNAL] "))] | sort_by(.createdAt) | reverse | .[0]')
          test -n "$JSON" && test "$JSON" != "null"
          NUMBER=$(printf '%s' "$JSON" | jq -r '.number')
          TITLE=$(printf '%s' "$JSON" | jq -r '.title')
          BODY=$(printf '%s' "$JSON" | jq -r '.body')
          CREATED=$(printf '%s' "$JSON" | jq -r '.createdAt')
          SYMBOL=$(printf '%s' "$TITLE" | sed -n 's/^\[SPOT SIGNAL\] \([A-Z0-9]*USDT\).*/\1/p')
          PCT=$(printf '%s' "$BODY" | sed -n 's/^- Cambio 24h: +\([0-9.-]*\)%.*/\1/p' | head -1)
          PRICE=$(printf '%s' "$BODY" | sed -n 's/^- Precio: \([0-9.eE+-]*\).*/\1/p' | head -1)
          test -n "$SYMBOL" && test -n "$PCT" && test -n "$PRICE" && test -n "$CREATED"
          echo "issue_number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "symbol=$SYMBOL" >> "$GITHUB_OUTPUT"
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "price=$PRICE" >> "$GITHUB_OUTPUT"
          echo "created_at=$CREATED" >> "$GITHUB_OUTPUT"
          echo 'test=false' >> "$GITHUB_OUTPUT"
          echo "SIGNAL_SYMBOL=$SYMBOL" >> "$GITHUB_ENV"
          echo "SIGNAL_PCT=$PCT" >> "$GITHUB_ENV"
          echo "SIGNAL_PRICE=$PRICE" >> "$GITHUB_ENV"
          echo "SIGNAL_CREATED_AT=$CREATED" >> "$GITHUB_ENV"

      - name: Confirm test approval path
        if: steps.signal.outputs.test == 'true'
        shell: bash
        run: |
          echo 'TEST_APPROVAL_OK: manual Run workflow reached the approval job. No Binance order was sent.'
          gh issue comment "${{ steps.signal.outputs.issue_number }}" --repo "$GITHUB_REPOSITORY" --body '✅ Prueba de aprobación manual completada desde **Spot Manual Approval**. No se envió ninguna orden a Binance.'

      - name: Set up Node.js
        if: steps.signal.outputs.test != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Revalidate and execute real Spot order
        if: steps.signal.outputs.test != 'true'
        working-directory: backend
        run: node scripts/github-spot-manual-execution.js

      - name: Mark real signal executed
        if: success() && steps.signal.outputs.test != 'true'
        shell: bash
        run: |
          gh issue comment "${{ steps.signal.outputs.issue_number }}" --repo "$GITHUB_REPOSITORY" --body '✅ Operación Spot aprobada manualmente mediante **Run workflow** y enviada por el puente GitHub → Binance. Revisa el log de este workflow y Binance para el orderId.'
          gh issue close "${{ steps.signal.outputs.issue_number }}" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### Spot Manual Approval' >> "$GITHUB_STEP_SUMMARY"
          echo '- GCP usado: no' >> "$GITHUB_STEP_SUMMARY"
          echo '- Activación: exclusivamente workflow_dispatch (Run workflow)' >> "$GITHUB_STEP_SUMMARY"
          echo "- Modo: ${{ inputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Símbolo: ${{ steps.signal.outputs.symbol || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Issue: #${{ steps.signal.outputs.issue_number || 'none' }}" >> "$GITHUB_STEP_SUMMARY"

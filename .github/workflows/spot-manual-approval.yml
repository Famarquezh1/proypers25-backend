name: Spot Manual Approval

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: spot-manual-approval
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve latest production Spot signal
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      issue_number: ${{ steps.signal.outputs.issue_number }}
      symbol: ${{ steps.signal.outputs.symbol }}
      pct: ${{ steps.signal.outputs.pct }}
      price: ${{ steps.signal.outputs.price }}
      created_at: ${{ steps.signal.outputs.created_at }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve latest production signal
        id: signal
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '[SPOT SIGNAL] in:title' --limit 50 --json number,title,body,createdAt --jq '[.[] | select(.title | startswith("[SPOT SIGNAL] "))] | sort_by(.createdAt) | reverse | .[0]')
          test -n "$JSON" && test "$JSON" != "null"
          NUMBER=$(printf '%s' "$JSON" | jq -r '.number')
          TITLE=$(printf '%s' "$JSON" | jq -r '.title')
          BODY=$(printf '%s' "$JSON" | jq -r '.body')
          CREATED=$(printf '%s' "$JSON" | jq -r '.createdAt')
          SYMBOL=$(printf '%s' "$TITLE" | sed -n 's/^\[SPOT SIGNAL\] \([A-Z0-9]*USDT\).*/\1/p')
          PCT=$(printf '%s' "$BODY" | sed -n 's/^- Cambio 24h: +\([0-9.-]*\)%.*/\1/p' | head -1)
          PRICE=$(printf '%s' "$BODY" | sed -n 's/^- Precio: \([0-9.eE+-]*\).*/\1/p' | head -1)
          test -n "$SYMBOL" && test -n "$PCT" && test -n "$PRICE" && test -n "$CREATED"
          echo "issue_number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "symbol=$SYMBOL" >> "$GITHUB_OUTPUT"
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "price=$PRICE" >> "$GITHUB_OUTPUT"
          echo "created_at=$CREATED" >> "$GITHUB_OUTPUT"

  execute:
    name: Execute approved Spot order from Chile PC
    needs: prepare
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    env:
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY || secrets.BINANCE_SECRET || secrets.BINANCE_API_SECRET || secrets.BINANCE_FUTURES_API_SECRET }}
      SIGNAL_SYMBOL: ${{ needs.prepare.outputs.symbol }}
      SIGNAL_PCT: ${{ needs.prepare.outputs.pct }}
      SIGNAL_PRICE: ${{ needs.prepare.outputs.price }}
      SIGNAL_CREATED_AT: ${{ needs.prepare.outputs.created_at }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Revalidate and execute real Spot order
        working-directory: backend
        run: node scripts/github-spot-manual-execution.js

  mark:
    name: Mark executed signal
    needs: [prepare, execute]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Close executed signal
        shell: bash
        run: |
          gh issue comment "${{ needs.prepare.outputs.issue_number }}" --repo "$GITHUB_REPOSITORY" --body '✅ Operación Spot aprobada mediante **Run workflow** y procesada por el runner local. Revisa Binance y el log de la ejecución para el orderId.'
          gh issue close "${{ needs.prepare.outputs.issue_number }}" --repo "$GITHUB_REPOSITORY" --reason completed

name: Spot Instant Decision Training V8.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/github-spot-instant-decision-trainer-v8.js'
      - 'backend/scripts/github-spot-instant-decision-trainer-v8_2.js'
      - '.github/workflows/spot-instant-decision-training-v8_2.yml'

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V8_EVAL_DAYS: '7'
      V8_MAX_SYMBOLS: '40'
      V8_MIN_QV: '200000'
      V8_ROUNDTRIP_COST: '0.0025'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guard isolated V8.2 trainer
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/scripts/github-spot-instant-decision-trainer-v8.js
          node --check backend/scripts/github-spot-instant-decision-trainer-v8_2.js
          ! grep -Eq 'BINANCE_(API|SECRET)_KEY|firebase-admin|firestore|placeOrder|createOrder|withdraw' backend/scripts/github-spot-instant-decision-trainer-v8_2.js
          grep -q "i+=1" backend/scripts/github-spot-instant-decision-trainer-v8_2.js
          grep -q "o.net>=0.005" backend/scripts/github-spot-instant-decision-trainer-v8_2.js
          grep -q "maxPerTime=1" backend/scripts/github-spot-instant-decision-trainer-v8_2.js
          grep -q "m.avgNet<0.0005" backend/scripts/github-spot-instant-decision-trainer-v8_2.js
      - name: Train true 5m walk-forward V8.2
        run: node backend/scripts/github-spot-instant-decision-trainer-v8_2.js
      - name: Upload V8.2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: spot-instant-decision-v8-2-${{ github.run_id }}
          path: spot-instant-decision-v8_2.json
          retention-days: 30
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### Spot Instant Decision Training V8.2' >> "$GITHUB_STEP_SUMMARY"
          echo '- Training cadence: true 5 minutes' >> "$GITHUB_STEP_SUMMARY"
          echo '- Retraining: daily from prior 7 days' >> "$GITHUB_STEP_SUMMARY"
          echo '- Learning target: >= +0.5% net realized trade' >> "$GITHUB_STEP_SUMMARY"
          echo '- Exit path: +3% TP / -1.2% SL / 3h timeout / costs included' >> "$GITHUB_STEP_SUMMARY"
          echo '- Selection: maximum one candidate per instant' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production mutation: none' >> "$GITHUB_STEP_SUMMARY"
          if [ -f spot-instant-decision-v8_2.json ]; then
            jq -r '"- Verdict: \(.verdict)\n- Ready days: \(.aggregate.readyDays)/\(.aggregate.evaluatedDays)\n- Positive days: \(.aggregate.positiveDays)\n- Trades: \(.aggregate.totalTrades)\n- Avg daily growth: \(.aggregate.avgDailyGrowth)\n- Avg net/trade: \(.aggregate.avgNetPerTrade)\n- Avg win rate: \(.aggregate.avgWinRate)"' spot-instant-decision-v8_2.json >> "$GITHUB_STEP_SUMMARY"
          fi

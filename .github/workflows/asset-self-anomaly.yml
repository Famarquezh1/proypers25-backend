name: Asset Self Anomaly
on:
  pull_request:
    paths: ['backend/scripts/github-asset-self-anomaly.js','.github/workflows/asset-self-anomaly.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check backend/scripts/github-asset-self-anomaly.js
      - run: node backend/scripts/github-asset-self-anomaly.js
      - uses: actions/upload-artifact@v4
        with: {name: asset-self-anomaly, path: asset-self-anomaly.json, retention-days: 30}

name: Spot Instant Decision Training V9

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/github-spot-instant-ev-trainer-v9.js'
      - '.github/workflows/spot-instant-decision-training-v9.yml'

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V9_MAX_SYMBOLS: '40'
      V9_MIN_QV: '200000'
      V9_ROUNDTRIP_COST: '0.0025'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guard isolated V9 trainer
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/scripts/github-spot-instant-ev-trainer-v9.js
          ! grep -Eq 'BINANCE_(API|SECRET)_KEY|firebase-admin|firestore|placeOrder|createOrder|withdraw' backend/scripts/github-spot-instant-ev-trainer-v9.js
          grep -q "const TRAIN_DAYS = 7" backend/scripts/github-spot-instant-ev-trainer-v9.js
          grep -q "const TP = 0.03" backend/scripts/github-spot-instant-ev-trainer-v9.js
          grep -q "const SL = 0.012" backend/scripts/github-spot-instant-ev-trainer-v9.js
          grep -q "PROMOTE_CONTROLLED_HUNTER" backend/scripts/github-spot-instant-ev-trainer-v9.js
      - name: Train and walk-forward V9
        run: node backend/scripts/github-spot-instant-ev-trainer-v9.js
      - name: Upload V9 evidence
        uses: actions/upload-artifact@v4
        with:
          name: spot-instant-decision-v9-${{ github.run_id }}
          path: spot-instant-decision-v9.json
          retention-days: 30
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### Spot Instant Decision Training V9' >> "$GITHUB_STEP_SUMMARY"
          echo '- Training: rolling 7 days, retrained daily' >> "$GITHUB_STEP_SUMMARY"
          echo '- Decision cadence: 5 minutes' >> "$GITHUB_STEP_SUMMARY"
          echo '- Model: expected net + TP probability + STOP probability' >> "$GITHUB_STEP_SUMMARY"
          echo '- Calibration may abstain completely when no policy is profitable' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production mutation: none' >> "$GITHUB_STEP_SUMMARY"
          if [ -f spot-instant-decision-v9.json ]; then
            jq -r '"- Verdict: \(.verdict)\n- Active days: \(.aggregate.activeDays)\n- Abstain days: \(.aggregate.abstainDays)\n- Positive active days: \(.aggregate.positiveActiveDays)\n- Trades: \(.aggregate.totalTrades)\n- Combined growth: \(.aggregate.combinedGrowth)\n- Avg net/trade: \(.aggregate.avgNetPerTrade)\n- Avg stop rate: \(.aggregate.avgStopRate)"' spot-instant-decision-v9.json >> "$GITHUB_STEP_SUMMARY"
          fi
